name: build pull request

on:
  pull_request:
    branches:
    - main
    - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: .