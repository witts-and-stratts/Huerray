        - generic [ref=e101]:
          - paragraph [ref=e102]: "Domino’s, creator meals, and the rise of participatory menus is more than a headline trend. It shows how creator marketing now works as an operating system: a way to test ideas, explain context, and turn audience attention into behavior that brands can measure."
          - paragraph [ref=e103]: The strongest campaigns in this space start by naming the audience clearly. For this topic, the audience includes local diners, franchise teams, and food creators. Each group needs a different reason to believe, which means the creative cannot rely on one generic message.
          - blockquote [ref=e104]: The best creator work does not make the brand louder. It makes the decision easier for the audience.
          - heading "The context behind the campaign" [level=2] [ref=e105]
          - paragraph [ref=e106]: "Creator-led strategy works because it brings the brand into real moments: menu launches, limited drops, and neighborhood recommendations. Those scenes give the campaign a setting, a problem, and a reason for the product or message to appear naturally."
