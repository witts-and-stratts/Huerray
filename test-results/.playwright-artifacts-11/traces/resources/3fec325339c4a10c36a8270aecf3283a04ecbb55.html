eptances are stored on a project basis. After project completion, we delete or anonymize data unless legal or contractual obligations require retention. Already granted usage rights remain unaffected (existing uses).f9:T90d,"])</script><script>self.__next_f.push([1,"(5) The Content creation process consists of the following steps: \u003cul class='ml-8'\u003e \u003cli class='mb-4'\u003e \u003ch6 class='font-bold'\u003ea. Briefing:\u003c/h6\u003e \u003cp\u003eThe Brand provides a description of the desired Content using the designated Platform functions, including all relevant specifications, requirements, and objectives (\"Briefing\"). The Briefing forms the basis of the Order. \u003c/p\u003e \u003c/li\u003e \u003cli class='mb-4'\u003e \u003ch6 class='font-bold'\u003eb. Creator proposals and applications:\u003c/h6\u003e \u003cp\u003eCreators connected to the platform can view the Order and apply to create the Content. Additionally, the platform automatically generates Creator suggestions based on internal criteria (e.g., target audience, style, past performance), even if those Creators have not actively applied.\u003c/p\u003e \u003c/li\u003e \u003cli class='mb-4'\u003e \u003ch6 class='font-bold'\u003ec. Selection and invitation:\u003c/h6\u003e \u003cp\u003eThe Brand may review both applications and automated suggestions and make a selection. Once a Creator or AI Creator is accepted, an invitation is automatically sent to the Creator to participate in the campaign. The Creator must confirm this invitation (“Acceptance”) for the Order to become binding. Until the Creator’s acceptance, Thrypes or the Brand may terminate the selection process at any time.\u003c/p\u003e \u003c/li\u003e \u003cli class='mb-4'\u003e \u003ch6 class='font-bold'\u003ed. Commissioning by Thrypes:\u003c/h6\u003e \u003cp\u003eUpon acceptance by the Creator or AI Creator, Thrypes commissions them—acting in its own name and under its own responsibility—to create the Content in accordance with the Brand’s Briefing. No direct contractual relationship arises between the Brand and the Creator.\u003c/p\u003e \u003c/li\u003e \u003cli class='mb-4'\u003e \u003ch6 class='font-bold'\u003ee. Content delivery:\u003c/h6\u003e \u003cp\u003eOnce completed, the Creator or AI Creator uploads the final Content via the Platform. This upload makes the Content electronically available to both Thrypes and the Brand. Uploading alone does not constitute acceptance by the Brand; acceptance is governed by § 6 of these GTC.\u003c/p\u003e \u003c/li\u003e \u003c/ul\u003e(6) We are entitled to engage subcontractors and external service providers (including Creators, AI Creator providers, technical providers, payment processors, or IT partners) in the performance of its services. Nevertheless, we remain the sole contractual partner of the Brand and are responsible for the proper execution of all services."])</script><script>self.__next_f.push([1,"fa:T419,The Order must include, in particular, the following details: \u003cul class='mb-4 ml-6'\u003e \u003cli class='mb-4'\u003ea. The product to be promoted and its description, including whether and in what form the product will be provided to the Creator;\u003c/li\u003e \u003cli class='mb-4'\u003e b. Technical specifications of the Content (e.g., length, format, aspect ratio, editing style);\u003c/li\u003e \u003cli class='mb-4'\u003ec. Creative requirements and messaging, desired flow, call-to-action elements, and prohibited content (“Don’ts”);\u003c/li\u003e \u003cli class='mb-4'\u003e d. Target audience and desired Creator characteristics (e.g., gender, age group, style); e. Deadlines and timelines;\u003c/li\u003e \u003cli class='mb-4'\u003e f. Any additional technical or aesthetic requirements specified in the Briefing.\u003c/li\u003e \u003c/ul\u003e(2) The binding conclusion of the contract occurs when we send written confirmation of the Order (e.g., via email) to the Brand. With this confirmation, we accepted the Brand’s offer, and a legally binding contract for Content creation was established. may accept Orders within two weeks of receipt.fb:T7d8,"])</script><script>self.__next_f.push([1,"(5) Cancellation after Order confirmation: After Thrypes confirms an Order, the Brand may cancel it only under limited conditions:\u003cul class='ml-8'\u003e\u003cli class='mb-4'\u003ea. If no Creator or AI Creator has been assigned or no invitation accepted at the time of cancellation, the Brand will receive a refund minus a cancellation fee of EUR 30.00 (plus VAT), issued as credit in the Brand’s Account.\u003c/li\u003e\u003cli class='mb-4'\u003eb. After a Creator or AI Creator has been selected and confirmed, cancellation is no longer possible, as service provision has already commenced.\u003c/li\u003e\u003c/ul\u003e(6) Inactivity / Expiration of deadlines: The Brand must, within 28 days of receiving the first Creator applications or system suggestions, select a Creator and provide all materials necessary for Content creation (e.g., products, materials, access). \u003cul class='ml-8'\u003e\u003cli class='mb-4'\u003ea. If no Creator is selected within this period, the contract is automatically terminated. Thrypes will refund the payment made by the Brand minus a cancellation fee of EUR 30.00 (plus VAT) as credit. \u003c/li\u003e\u003cli class='mb-4'\u003eb. If a Creator has already been selected but the Brand fails to provide the required materials within the deadline, the Order is automatically terminated. In this case, Thrypes refunds 60% of the fee as credit; 40% of the Order value (plus VAT) is retained as a cancellation fee.\u003c/li\u003e\u003c/ul\u003e(7) Thrypes may additionally offer credit models or subscription plans that allow Brands to pre-purchase or regularly request multiple Content Orders. a. Each credit balance is valid for 2 years from the purchase date and can only be redeemed through the Platform. b. Unused contingents from subscriptions expire at the end of the respective billing period and cannot be carried over to subsequent months. c. Subscription payments are processed via Stripe, Inc. or a comparable payment provider.\u003cbr /\u003e\u003cbr /\u003e (8) Thrypes issues invoices in compliance with Section 14 of the German VAT Act (UStG) and may send payment reminders electronically."])</script><script>self.__next_f.push([1,"fc:T6fd,"])</script><script>self.__next_f.push([1,"(1) The Brand undertakes to comply with all applicable laws, governmental regulations, and contractual obligations when using the Huerray Platform. This includes, in particular: \u003cul class='ml-8'\u003e \u003cli class='mb-4'\u003ea. compliance with data protection regulations, especially the General Data Protection Regulation (GDPR), the Federal Data Protection Act (BDSG), and all other relevant European or national data protection laws;\u003c/li\u003e \u003cli class='mb-4'\u003eb. the obligation to promote or present only such products, services, or brands on the Platform that the Brand is legally authorized to offer, advertise, or distribute;\u003c/li\u003e \u003cli class='mb-4'\u003ec. the obligation to respect the personal rights of third parties (including Creators, customers, and other participants) and to refrain from submitting or publishing any content, statements, or data that \u003cul class='ml-4'\u003e \u003cli class='mb-4'\u003ei. violate laws, government orders, or public decency,\u003c/li\u003e \u003cli class='mb-4'\u003eii. glorify violence, are pornographic or offensive, or\u003c/li\u003e \u003cli class='mb-4'\u003eiii. discriminate against individuals based on origin, skin color, gender, religion, belief, age, disability, or sexual identity;\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e \u003cli class='mb-4'\u003ed. the prohibition of manipulative behavior on the Platform, including any attempts to unlawfully influence reviews, application processes, or Creator selections, spread false information, or use automated systems (bots, scripts, etc.);\u003c/li\u00 "Match with experienced creators\"},\"testimonial\":{\"company\":\"Intelligencia Media\",\"quote\":\"We immediately published the first ad variations with Billo's recommended structure, we didn't edit anything, and it already worked better than our previous ads. Our ROAS was better and acquisition costs went down. We were able to scale larger because of that.\",\"author\":\"Jorens, CEO\"},\"creatorsSection\":{\"label\":\"Creators\",\"title\":\"Get paid to do what you love\",\"description\":\"Find collaborations that gets you excited. Work with brands that fit your content style, with special autonomy over every campaign your produce\"},\"platformLogos\":{\"title\":\"Available to be used on\"}},\"creators\":{\"hero\":{\"title\":\"Get paid for doing what you love\",\"subtitle\":\"Work with brands \u0026 real companies. Start earning cash for what you love.\",\"buttonText\":\"Become a Creator\",\"paymentMade\":\"Payment made\"},\"categories\":{\"fashion\":\"Fashion\",\"lifestyle\":\"Lifestyle\",\"beauty\":\"Beauty\",\"fitness\":\"Fitness\",\"food\":\"Food\",\"travel\":\"Travel\",\"tech\":\"Tech\",\"healthWellness\":\"Health \u0026 Wellness\",\"sport\":\"Sport\",\"skincare\":\"Skincare\"},\"collaborations\":{\"pill\":\"Matching\",\"title\":\"Collaborations that fit your style\",\"description\":\"Matching Brands based on your style and content preference.\"},\"director\":{\"pill\":\"Creative Control\",\"title\":\"Be the creative director\",\"description\":\"Gain creative autonomy over your creations. Be the centre of the show.\"},\"manage\":{\"pill\":\"Automation\",\"title\":\"You create. We manage everything else\",\"description\":\"Our team and technology helps manage the experience with brands, so you can focus on creating the best content.\"},\"paid\":{\"pill\":\"Payments\",\"title\":\"Get paid on time, everytime\",\"description\":\"You get automatic payments when the clients approve your creation. No question asked.\"},\"benefits\":{\"heading\":\"Why creators choose Huerray\",\"authentic\":{\"title\":\"Authentic collaborations\",\"description\":\"Work with brands that want creator-led content instead of generic ad creative.\"},\"collaboration\":{\"title\":\"Flexible partnerships\",\"description\":\"Choose opportunities that fit your style, audience, and schedule.\"},\"monetize\":{\"title\":\"Reliable earnings\",\"description\":\"See compensation upfront and get paid once your approved work is delivered.\"},\"creative\":{\"title\":\"Creative control\",\"description\":\"Bring your own perspective to every brief while staying aligned with campaign goals.\"},\"support\":{\"title\":\"Operational support\",\"description\":\"Let Huerray handle platform flow, approvals, and coordination so you can focus on making content.\"},\"grow\":{\"title\":\"Room to grow\",\"description\":\"Build your portfolio, strengthen your creator profile, and unlock more relevant brand work over time.\"}},\"testimonial\":{\"quote\":\"Huerray advocates for their creators...from making sure that we get paid fairly to constantly giving us brand opportunities that matches our lifestyle\",\"author\":\"Baron McHennie – @baron_mchennie\"},\"cta\":{\"buttonText\":\"Become a Creator\",\"subtitle\":\"Join thousands of creators\",\"title\":\"Get paid to do what you love\"},\"faq\":{\"heading\":\"FAQs\",\"q1\":{\"question\":\"How do I get started as a creator?\",\"answer\":\"Simply sign up, complete your profile, and start browsing available brand collaborations. Once approved, you can begin creating content.\"},\"q2\":{\"question\":\"What are the requirements to join?\",\"answer\":\"We welcome creators of all sizes. You need an active social media presence and the ability to create quality content that engages your audience.\"},\"q3\":{\"question\":\"How much can I earn?\",\"answer\":\"Earnings vary based on your audience size, engagement rates, and the scope of each collaboration. You'll see compensation details upfront for each opportunity.\"},\"q4\":{\"question\":\"How do payments work?\",\"answer\":\"You'll receive payment once your content is approved by the brand and meets the campaign requirements. Payments are processed securely through our platform.\"},\"q5\":{\"question\":\"Can I choose which brands to work with?\",\"answer\":\"Absolutely! You have full control over which collaborations you accept. Only work with brands that align with your values and audience.\"},\"q6\":{\"question\":\"What type of content do I need to create?\",\"answer\":\"Content types vary by campaign but typically include photos, videos, reels, or stories. Each brief provides detailed requirements and creative guidelines.\"},\"q7\":{\"question\":\"How long does it take to get paid?\",\"answer\":\"Payments are processed automatically once the brand approves your content. You'll typically receive payment within 3-5 business days.\"},\"q8\":{\"question\":\"Can I work with multiple brands at once?\",\"answer\":\"Yes! You can collaborate with as many brands as you'd like, as long as there are no exclusivity clauses in your agreements.\"},\"q9\":{\"question\":\"What if I don't meet a campaign deadline?\",\"answer\":\"We understand things happen. Communicate with us early if you need an extension. However, missing deadlines without notice may affect future opportunities.\"},\"q10\":{\"question\":\"Do I need professional equipment?\",\"answer\":\"Not necessarily. Many successful creators use smartphones. What matters most is creating authentic, engaging content that resonates with your audience.\"},\"q11\":{\"question\":\"How are brand matches determined?\",\"answer\":\"Our matching algorithm considers your content style, audience demographics, engagement rates, and brand preferences to suggest the best collaborations for you.\"}}},\"brands\":{\"hero\":{\"title\":\"Collaborate with top creators\",\"subtitle\":\"Work with brands \u0026 real companies. Start earning cash for what you love.\",\"buttonText\":\"Get Started\"},\"scroller\":{\"title\":\"Match with experienced creators\"},\"match\":{\"pill\":\"Matching\",\"title\":\"Match with the right creators for your brand\",\"description\":\"Our matching process means 92% of creator matches are approved in the first round.\",\"listItems\":{\"item1\":\"Fully opted-in and verified network of creators\",\"item2\":\"A large network of diverse creators from underrepresented communities and niche categories\"},\"paymentMade\":\"Payment made\"},\"contentObjective\":{\"pill\":\"Quality Content\",\"title\":\"Content for every objective\",\"description\":\"Creators produce high-quality content, with a range of output that is adapted to match your goals and requirements.\",\"listItems\":{\"item1\":\"Whether it's a beauty commercial, review for automotive or showcase of baby products, you will find the specialised creator content\",\"item2\":\"From UGC to specialised content, you can pick based on your goals\",\"item3\":\"From additional content to entertainment content, to product reviews and live events, creator content is versatile\"}},\"expertSupport\":{\"pill\":\"Dedicated Support\",\"title\":\"Expert level support\",\"description\":\"Our team is here to ensure that you're matched with the right creators, deliverables are handed off on time, and to make sure that your campaign and creative strategy is a success.\",\"listItems\":{\"item1\":\"Too busy? Let us handle back and forth with creators\",\"item2\":\"Campaign reviews before your approval, so you don't have to go through request that are not aligned\",\"item3\":\"We manage live campaigns and deliverables for you, so you don't miss your launch date\"}},\"beyondFeed\":{\"pill\":\"Omni-Channel\",\"title\":\"Beyond your content feed\",\"description\":\"Content created by creators are licensed to you for use in all your marketing channels. From your Website, E-commerce platform, Youtube or in-flight entertainment, create a truly omni-channel creator marketing experience.\",\"listItems\":{\"item1\":\"Repurpose creator content across all your marketing channels\",\"item2\":\"No guess work and unplanned expenses. Zero extra cost for multiple platform usage\"},\"contentUsageTitle\":\"Content Usage\",\"contentUsageItems\":{\"item1\":\"Store on Shopify\",\"item2\":\"Cinema\",\"item3\":\"Inflight entertainment\",\"item4\":\"In-Game\"}},\"stopAssuming\":{\"pill\":\"Measurement\",\"title\":\"Stop assuming what's working\",\"description\":\"Keep a pulse on what's happening during the creative process, with constant feedback and updates.\",\"listItems\":{\"item1\":\"Track your campaign and see how it performs\",\"item2\":\"Campaign walkthroughs and insights on all your projects/briefs\"},\"contentPerformance\":\"Content Performance\"},\"cta\":{\"subtitle\":\"Join thousands of brands getting awesome content\",\"title\":\"Join the marketplace. Find your next brand ambassadors\",\"buttonText\":\"Get started\"},\"industry\":{\"title\":\"Content for every industry\",\"categories\":{\"sport\":\"Sport\",\"lifestyle\":\"Lifestyle\",\"fashion\":\"Fashion\",\"beauty\":\"Beauty\",\"skincare\":\"Skincare\",\"food\":\"Food\",\"tech\":\"Tech\",\"fitness\":\"Fitness\"}},\"faq\":{\"heading\":\"Frequently Asked Questions\",\"q1\":{\"question\":\"What is Huerray?\",\"answer\":\"Huerray is a platform that connects brands with creators to produce high-quality content.\"},\"q2\":{\"question\":\"How do I get started?\",\"answer\":\"Sign up for an account and create a campaign to start matching with creators.\"},\"q3\":{\"question\":\"What kind of content can I get?\",\"answer\":\"You can get a wide range of content, from social media posts to professional videos.\"},\"q4\":{\"question\":\"How much does it cost?\",\"answer\":\"The cost depends on the scope of your campaign and the creators you work with.\"},\"q5\":{\"question\":\"How long does it take?\",\"answer\":\"The timeline varies depending on the project, but you can typically get content within a few weeks.\"},\"q6\":{\"question\":\"How do I pay creators?\",\"answer\":\"Payments are handled securely through our platform. You can pay with a credit card or bank transfer.\"},\"q7\":{\"question\":\"Can I use the content on my own channels?\",\"answer\":\"Yes, you have full rights to use the content on your own marketing channels.\"},\"q8\":{\"question\":\"What if I'm not happy with the content?\",\"answer\":\"We have a revision process to ensure you're happy with the final product. If you're still not satisfied, we offer a money-back guarantee.\"},\"q9\":{\"question\":\"How do you vet creators?\",\"answer\":\"We have a rigorous vetting process to ensure that all creators on our platform are professional and produce high-quality work.\"},\"q10\":{\"question\":\"Do you offer managed services?\",\"answer\":\"Yes, we offer managed services for brands that want a more hands-off approach. Our team can handle everything from campaign strategy to creator management.\"},\"q11\":{\"question\":\"I have another question\",\"answer\":\"Please contact us at support@huerray.com for any other questions.\"}}},\"pricing\":{\"hero\":{\"title\":\"Pay for UGC, not hidden fees\",\"subtitle\":\"Every dollar goes toward a scalable, on-brand UGC that drives results, not platform fees\"},\"cards\":{\"disclaimer\":\"All prices are for one video, excluding VAT.\",\"buttonText\":\"Create a brief\",\"short\":{\"tag\":\"Short\",\"title\":\"15 Seconds\",\"price\":\"€149.99\",\"features\":[\"TikTok-Video\",\"Instagram-Story \u0026 Reels\",\"Pinterest-Video\",\"Snapchat-Ad\"]},\"medium\":{\"tag\":\"Medium\",\"title\":\"30 Seconds\",\"price\":\"€269.99\",\"features\":[\"Instagram-Reel\",\"TikTok-Ads\",\"Snapchat-Ad\",\"Live-Shopping\",\"Landing-page\"]},\"long\":{\"tag\":\"Long\",\"title\":\"60 Seconds\",\"price\":\"€349.99\",\"features\":[\"TikTok-Video\",\"Instagram-Story \u0026 Reels\",\"Pinterest-Video\",\"Snapchat-Ad\"]}},\"features\":{\"title\":\"Same great features for all plans\",\"items\":[{\"title\":\"Unlimited project requests\",\"text\":\"From unboxing \u0026 testimonial videos to product \u0026 model photography - get the content you need.\"},{\"title\":\"Review applications from diverse creators\",\"text\":\"Every age, race, gender, and vibe, Huerray has a content creator ideal for your brand.\"},{\"title\":\"No creator negotiations\",\"text\":\"Huerray creators work on a set budget for all of your projects.\"},{\"title\":\"Full licensing \u0026 distribution rights to your content\",\"text\":\"100% licensing \u0026 distribution rights to use on social, websites, ads, \u0026 more.\"},{\"title\":\"Realtime feedback\",\"text\":\"Exchange feedback with your creators using our in-built communication feature. Make adjustments where needed, or refine your requirements.\"}]},\"extra\":{\"ai\":{\"subtitle\":\"State of the art/next-gen\",\"title\":\"AI Generated Videos\",\"priceLabel\":\"From\",\"price\":\"€79.99\",\"buttonText\":\"Create a brief\"},\"enterprise\":{\"badge\":\"Extra + Managed\",\"title\":\"Enterprise Plan\",\"description\":\"Need more generated content? Talk to our team\",\"features\":[\"Request service\",\"Discuss requirements\",\"Receive a customised offer\",\"Ready for takeoff\"],\"buttonText\":\"Book A Call\"}},\"faqs\":{\"title\":\"Ask us Questions\",\"items\":[{\"question\":\"How long does it take for my creator application to be reviewed?\",\"answer\":\"Due to the high volume of applications we receive, the review process may take some time. We strive to process applications as quickly as possible, but please note that it can vary based on demand and our current capacity. Rest assured, we'll notify you as soon as there's an update on your application status. Thank you for your patience!\"},{\"question\":\"Do I need a certain amount of followers to join Huerray?\",\"answer\":\"No. You might not even have social media and that's totally fine. All you have to do is shoot content to get paid.\"},{\"question\":\"Do I have to post on social channels?\",\"answer\":\"No. All you have to do is upload the content to the Huerray platform.\"},{\"question\":\"Do I have to pay to join?\",\"answer\":\"No, Huerray is 100% free for creators.\"},{\"question\":\"How do I find gigs?\",\"answer\":\"You choose the projects from brands that align with your personal aesthetic and apply for those partnerships. Every day the application is updated with new partnerships. Only work with brands you want to!\"},{\"question\":\"What kind of gigs can I find on Huerray?\",\"answer\":\"Photo and video jobs are our forte. Product photography, lifestyle photos, product in action videos, unboxing videos, testimonial videos, portrait style photos. All content that ecommerce brands can leverage.\"}]},\"cta\":{\"title\":\"Ready for your first UGC video?\",\"buttonText\":\"Register now\"}},\"about\":{\"hero\":{\"title\":\"Huerray\\nEvery Hue. Every Story\",\"subtitle\":\"We connect brands with creators from underrepresented communities to build authentic UGC that converts — culturally rich, emotionally real, and designed for today's social feeds.\"},\"why\":{\"pill\":\"Our Why\",\"title\":\"Marketing that represents real people performs and feels better\",\"description\":\"At Huerray we believe inclusion isn't a checkbox: it's the creative standard. We help brands reach diverse audiences through content that's human, relatable and rooted in lived experience.\"},\"whatWeDo\":{\"pill\":\"What We Do\",\"title\":\"We connect brands with creators who actually care about their products\",\"description\":\"Huerray is a platform that matches brands with the perfect creators for authentic content. We handle everything from discovery to payment, so you can focus on what matters: creating great content.\",\"features\":[\"Smart creator matching\",\"Transparent pricing\",\"Secure payments\",\"Content rights management\"]},\"values\":{\"title\":\"Our Values\",\"items\":[{\"title\":\"Authenticity First\",\"description\":\"We believe in genuine connections between brands and creators\"},{\"title\":\"Fair Compensation\",\"description\":\"Creators deserve to be paid fairly for their work and influence\"},{\"title\":\"Transparency\",\"description\":\"Clear expectations and honest communication at every step\"},{\"title\":\"Quality Over Quantity\",\"description\":\"We focus on meaningful collaborations, not just numbers\"}]},\"story\":{\"pill\":\"Our Story\",\"title\":\"Huerray is Rewriting the 2-3 Referrals Brands Attract and Connect at This End\",\"subtitle\":\"A journey from frustration to innovation\",\"content\":\"Founded by creators and marketers who experienced the pain points of influencer marketing firsthand, Huerray was built to solve real problems. We've created a platform that respects both brands and creators, making collaborations smoother, fairer, and more effective.\"},\"team\":{\"subtitle\":\"Our Founding Story\",\"title\":\"Born in Berlin; founded by 3 friends from different corners of the world\",\"description\":\"Huerray grew from a simple observation: great creators were being overlooked because they didn't fit a narrow template. So we built a platform that makes visibility scalable — where creators are trusted to lead narratives and brands get content that actually connects.\",\"members\":[{\"name\":\"Adedapo\",\"bio\":\"A business strategist from Nigeria, had spent years watching brilliant creators being overlooked — not because they lacked skill, but because they didn't fit the mold.\"},{\"name\":\"Norina\",\"bio\":\"A marketing mind from Austria with Indian roots, crafted campaigns for global brands yet rarely saw faces or stories that mirrored her own.\"},{\"name\":\"\",\"bio\":\"\"}]},\"cta\":{\"subtitle\":\"Join thousands of creators \u0026 businesses collaborating to create impactful content for everyone\",\"buttonText\":\"Begin Here\"}},\"career\":{\"hero\":{\"title\":\"Join a movement moving creative culture forward\",\"subtitle\":\"We bring together culture, creativity, and technology to give creatives and underrepresented voices across the DACH region the visibility they deserve. And behind the scenes, we live what we stand for: diversity, openness, courage, and true collaboration.\",\"buttonText\":\"See open positions\",\"videoAlt\":\"Young woman showcasing fashion\",\"imageAlt1\":\"Main creator\",\"imageAlt2\":\"Creator content\",\"imageAlt3\":\"Creator portrait\"},\"opportunities\":{\"title\":\"Open Opportunities\",\"subtitle\":\"If you're the owner of an active brain, interesting thoughts, and a good soul, we would like to hear from you.\",\"button\":\"Learn More\",\"jobs\":[{\"category\":\"Product, Design \u0026 Data\",\"title\":\"Lead Product Designer\",\"location\":\"Germany. Full time - Remote\"},{\"category\":\"Sales Enablement\",\"title\":\"Sales Enablement Manager\",\"location\":\"Austria. Full time - Remote\"},{\"category\":\"Customer Experience\",\"title\":\"Senior Client Success Manager\",\"location\":\"Switzerland. Full time - Remote\"}]},\"ourValues\":{\"title\":\"Our Values\",\"values\":[{\"title\":\"Diversity\",\"text\":\"Diversity isn't a slogan. It's who we are, in our team, our partners, and our ideas.\"},{\"title\":\"Authenticity always\",\"text\":\"We don't do façades. We want real people with real stories and perspectives.\"},{\"title\":\"Innovation with purpose\",\"text\":\"Technology is only exciting when it creates change. We use it to make representation visible, not to replace it.\"},{\"title\":\"Community over competition\",\"text\":\"We believe in collaboration, exchange, and support, because real change only happens together.\"}]},\"ourTeams\":{\"title\":\"Our Teams\",\"teams\":[{\"title\":\"Product, Design, \u0026 Data\",\"text\":\"We are building the platform of record that powers content creation and distribution for brands globally. Our mission is to serve the creator economy and provide them with the best place on earth to do what they love—create.\"},{\"title\":\"Customer Experience\",\"text\":\"We are the secret sauce of #paid–creating and enabling customer and creator experiences that deliver results, impact, and most importantly, joy.\"},{\"title\":\"Sales\",\"text\":\"Our goal is to educate brands and agencies how to think about creator marketing. We do deep discovery, tailoring our offering to help clients hit their objectives.\"},{\"title\":\"People\",\"text\":\"People are the Soul of our company. We live this value by sourcing the best humans and then providing the best environment for our people to have career defining moments.\"},{\"title\":\"Finance\",\"text\":\"Our Finance team works to build processes and policies that ensure accurate and timely information so that our other teams are supported to make informed business decisions.\"},{\"title\":\"Media, Analytics \u0026 Strategy\",\"text\":\"We have a passion for analytics and all things digital. We find solutions for sophisticated challenges that span across creative, strategic and technical and analytical dimensions.\"},{\"title\":\"Marketing\",\"text\":\"Our goal is to build a brand that people can't get off their minds. Together, we strive to create memorable moments with brands and creators.\"},{\"title\":\"Engineering\",\"text\":\"We design tools and features that create the foundation for brands and creators to collaborate together. We define the future of #paid and look into ways we can scale and share the future of the Creator Economy.\"}]},\"careerWhy\":{\"mainTitle\":\"We envision a world were creators are passionate about building something that matters\",\"subtitle\":\"Huerray is a space for people who love ideas, who believe in creativity with purpose, and who want to make real change happen.\",\"description1\":\"Whether your background is in marketing, tech, design, business development, or community. Huerray is a space for people who love ideas, who believe in creativity with purpose, and who want to make real change happen. whether your background is in marketing, tech, design, business development, or community. We care less about titles and more about who you are, what you stand for, and the energy you bring. We're growing, organically, intentionally, and with purpose.\",\"description2\":\"We're always open to meeting people who share our vision and want to help shape it.\",\"imageAlt\":\"Why Huerray\"}},\"privacy-policy\":{\"page\":{\"title\":\"Privacy Policy\"},\"seo\":{\"title\":\"Privacy Policy\",\"description\":\"Learn how HUERRAY GmbH collects, uses, and protects your personal data in accordance with GDPR and German data protection laws.\",\"keywords\":\"privacy policy, data protection, GDPR, personal data, HUERRAY, user rights, data security\"},\"effectiveDateTitle\":\"Last Updated\",\"effectiveDate\":\"October 21, 2025\",\"tableOfContents\":\"Table of Contents\",\"introNote\":\"These Privacy Policies have been translated from German. Until establishment of the British Ltd, HUERRAY still falls under the German Entity. And so until then, the terms and conditions of HUERRAY as stipulated by the German Entity applies.\",\"sections\":[{\"id\":\"introduction\",\"title\":\"Introduction\",\"content\":\"\u003cstrong\u003eThese Privacy Policies have been translated from German. Until establishment of the British Ltd, HUERRAY still falls under the German Entity. And so until then, the terms and conditions of HUERRAY as stipulated by the German Entity applies.\u003c/strong\u003e\u003cbr /\u003e\u003cbr /\u003eThis Privacy Policy explains how THRYPES GmbH, 4th Floor,\u003cbr /\u003e Gontardstr. 11, 10178 Berlin, Germany (hereinafter referred to as “THRYPES, ” “we, ” or “us”), processes personal data when you use our websites, platforms, social media pages, communication channels, and services related to user-generated content (UGC); when you register as a creator/influencer or as a corporate client; when you cooperate with us, enter into contracts, or otherwise interact with us. \u003cbr /\u003e\u003cbr/\u003eWe process data within the DACH region in accordance with the General Data Protection Regulation (EU) 2016/679 (“GDPR”), the German Federal Data Protection Act (BDSG), the Telecommunications Telemedia Data Protection Act (TTDSG), and other applicable data protection laws.\"},{\"id\":\"controller-and-contact\",\"title\":\"1. Controller and Contact\",\"content\":\"The controller within the meaning of \u003cstrong\u003eArt. 4(7) GDPR\u003c/strong\u003e is:\u003cbr /\u003e\u003cstrong\u003eTHRYPES GmbH\u003c/strong\u003e,\u003cbr /\u003e 4th Floor,\u003cbr /\u003e Gontardstr. 11,\u003cbr /\u003e 10178 Berlin, Germany. \u003cbr /\u003e\u003cbr /\u003eFor general inquiries, please contact us at: \u003cstrong\u003einfo@huerray.de\u003c/strong\u003e\",\"subsections\":[]},{\"id\":\"data-protection-officer\",\"title\":\"2. Data Protection Officer\",\"content\":\"We have appointed a Data Protection Officer, who can be reached as follows: THRYPES GmbH, 4th Floor, Gontardstr. 11, 10178 Berlin, Germany. Email: datenschutz@huerray.de\",\"subsections\":[]},{\"id\":\"complaints\",\"title\":\"3. Complaints\",\"content\":\"You have the right to lodge a complaint at any time with the competent data protection authority. However, we would appreciate the opportunity to address your concerns before you contact the authority — so please reach out to us first.\",\"subsections\":[]},{\"id\":\"general-information\",\"title\":\"4. General Information on Data Processing\",\"subsections\":[{\"id\":\"scope-of-processing\",\"title\":\"a) Scope of the Processing of Personal Data\",\"content\":\"We process personal data of our users only to the extent necessary to provide a functional website/platform and to deliver our business-related content and services. Processing generally occurs based on your consent (e.g., via our consent manager for analytics/marketing technologies, newsletter subscriptions, or published UGC content). An exception applies in cases where obtaining prior consent is not possible for practical reasons and the processing is permitted by legal provisions or is necessary for contract performance. \u003cbr /\u003e\u003cbr /\u003eWe adhere to the principles of transparency, purpose limitation, data minimization, accuracy, storage limitation, and integrity/confidentiality in accordance with Art. 5 GDPR.\"},{\"id\":\"legal-basis\",\"title\":\"b) Legal Basis for the Processing of Personal Data\",\"list\":[\"We process data based on the following legal grounds:\u003cbr/\u003e\u003cbr/\u003e\u003cstrong\u003eConsent (Art. 6(1)(a) GDPR):\u003c/strong\u003e where you have explicitly given consent via the consent manager or otherwise (e.g., for Google Analytics/GA4, marketing emails under the double opt-in procedure, or publication of image/video material beyond contractual obligations). Consent is voluntary and may be withdrawn at any time with future effect\",\"\u003cstrong\u003eContract / Pre-contractual measures (Art. 6(1)(b) GDPR):\u003c/strong\u003e where processing is necessary to fulfill a contract with you or to carry out pre-contractual measures (e.g., creator onboarding, briefing, production, approval, payment, customer service)\",\"\u003cstrong\u003eLegal obligation (Art. 6(1)(c) GDPR):\u003c/strong\u003e where processing is required to comply with legal obligations (e.g., commercial/tax retention, compliance, or disclosure to authorities)\",\"\u003cstrong\u003eVital interests (Art. 6(1)(d) GDPR):\u003c/strong\u003e in rare cases, where processing is necessary to protect vital interests of the data subject or another natural person\",\"\u003cstrong\u003eLegitimate interests (Art. 6(1)(f) GDPR):\u003c/strong\u003e where processing is necessary to safeguard our legitimate interests or those of third parties, provided your interests or fundamental rights do not override them (e.g., IT security, fraud prevention, minimal reach measurement, quality management, legal enforcement/defense, or the selection of suitable creators based on objective, non-automated criteria)\",\"\u003cstrong\u003eTTDSG:\u003c/strong\u003e Storing information or accessing information on your device (e.g., cookies, device IDs) requires your consent under § 25(1) TTDSG unless technically essential. The subsequent processing is then based on one of the above GDPR legal bases. For existing customer advertising, § 7(3) UWG may apply.\"]},{\"id\":\"data-deletion\",\"title\":\"c) Data Deletion and Retention Period\",\"content\":\"Personal data is deleted or blocked as soon as the purpose of storage ceases to apply. Data may be stored beyond this point if required by European or national legislators in EU regulations, laws, or other provisions to which we are subject (e.g., commercial/tax retention obligations under the German Commercial Code (HGB) or Fiscal Code (AO), typically for 6 to 10 years). \u003cbr /\u003e\u003cbr /\u003eBlocking or deletion also occurs when a legally prescribed retention period expires, unless continued storage is necessary for contract fulfillment or the assertion/defense of legal claims. After expiration, data will be deleted or, where possible, anonymized.\"}]},{\"id\":\"website-provision\",\"title\":\"5. Provision of the Website\",\"subsections\":[{\"id\":\"description-scope\",\"title\":\"a) Description and Scope of Data Processing\",\"content\":\"Each time our website is accessed, our system automatically collects data and information from the accessing device. This includes in particular:\u003cbr/\u003e\u003cbr/\u003e(1) Information about the browser/device type and version used\u003cbr/\u003e(2) The operating system of the user\u003cbr/\u003e(3) The user's internet service provider\u003cbr/\u003e(4) The user's IP address\u003cbr/\u003e(5) Date and time of access\u003cbr/\u003e(6) Referrer URL (the website from which the user was referred to our site)\u003cbr/\u003e(7) Pages/files accessed and duration of stay on our website\u003cbr/\u003e\u003cbr/\u003eThe data is processed for the duration of the session to enable delivery of the website. It is also stored in our system log files. These data are not stored together with other personal data of the user.\"},{\"id\":\"legal-basis-website\",\"title\":\"b) Legal Basis for Data Processing\",\"content\":\"The legal basis for the temporary storage of data and logging in log files is Art. 6(1)(f) GDPR. Our legitimate interest lies in ensuring the technical functionality, stability, and security of the website (e.g., detecting misuse or attacks), as well as performance monitoring and troubleshooting.\"},{\"id\":\"purpose-website\",\"title\":\"c) Purpose of Processing\",\"content\":\"Temporary storage of the IP address by the system is necessary to deliver the website to the user's device. For this purpose, the user's IP address must remain stored for the duration of the session. These purposes also constitute our legitimate interest in data processing pursuant to Art. 6(1)(f) GDPR.\"},{\"id\":\"storage-duration-website\",\"title\":\"d) Storage Duration\",\"content\":\"The data is deleted as soon as it is no longer required to achieve the purpose of its collection. In the case of website provision, this occurs when the respective session ends.\"},{\"id\":\"right-to-object-website\",\"title\":\"e) Right to Object and Removal Option\",\"content\":\"The collection and storage of data for website provision and logging in log files is essential for operating the website. Consequently, the user has no option to object to this processing.\"}]},{\"id\":\"cookies\",\"title\":\"6. Use of Cookies and Similar Technologies\",\"subsections\":[{\"id\":\"cookies-description\",\"title\":\"a) Description and Scope of Data Processing\",\"content\":\"When you use our services, we and selected third parties may use cookies and similar technologies (e.g., local storage, pixels, tags, and SDKs) to provide you with a better, faster, and more secure user experience, or to enable audience measurement and personalized content/advertising. Cookies are small text files that are stored on your device when you visit our website. Through our Consent Management Platform (CMP), you can manage which technologies and providers you consent to, based on specific purposes.\"},{\"id\":\"cookies-legal-basis\",\"title\":\"b) Legal Basis for Data Processing\",\"content\":\"Depending on the type and purpose of the technology, processing is based on:\",\"list\":[\"\u003cstrong\u003eArt. 6(1)(a) GDPR in conjunction with § 25(1) TTDSG (Consent)\u003c/strong\u003e — e.g., for analytics/marketing and personalized content or advertising\",\"\u003cstrong\u003eArt. 6(1)(b) GDPR (Contract/Pre-contractual measures)\u003c/strong\u003e — where the use of technologies is technically necessary to provide requested services (e.g., shopping cart/session cookies, login, consent storage);\",\"\u003cstrong\u003eArt. 6(1)(f) GDPR in conjunction with § 25(2) TTDSG (Legitimate interests / Technically necessary storage)\u003c/strong\u003e — e.g., to ensure IT security and essential website functionality.\"]},{\"id\":\"cookies-purpose\",\"title\":\"c) Purpose of Data Processing\",\"content\":\"Our cookies and similar technologies serve different purposes, including:\",\"list\":[\"\u003cstrong\u003eTechnically necessary:\u003c/strong\u003e Provision of our services (e.g., session control, security, consent storage);\",\"\u003cstrong\u003eTechnical optimization:\u003c/strong\u003e Monitoring of error messages, load times, and system stability;\",\"\u003cstrong\u003eAnalytics/Statistics:\u003c/strong\u003e Evaluation of user behavior (aggregated/pseudonymized) for continuous improvement of our products and content;\",\"\u003cstrong\u003eConvenience/Personalization:\u003c/strong\u003e Enhancement of user experience (e.g., preferences such as font size, language, or last form inputs);\",\"\u003cstrong\u003eMarketing/Personalized content (only with consent):\u003c/strong\u003e Display and measurement of advertising campaigns, potentially across multiple platforms.\"]},{\"id\":\"cookies-storage\",\"title\":\"d) Storage Duration\",\"content\":\"Cookies and comparable technologies are deleted once they are no longer necessary for achieving their purpose or once you withdraw your consent.\"},{\"id\":\"cookies-objection\",\"title\":\"e) Right to Object and Removal Options\",\"content\":\"Where cookies or technologies are technically required, there is no option to object, as they are essential for operating the website. \u003cbr /\u003e\u003cbr /\u003eIf cookies/technologies are used based on your consent, you can withdraw your consent at any time with future effect — either via the consent manager or through your browser settings (e.g., deleting/blocking cookies). \u003cbr /\u003e\u003cbr /\u003ePlease note that withdrawing consent may limit the functionality of the website.\"}]},{\"id\":\"email-newsletter\",\"title\":\"7. Email Delivery and Newsletter\",\"subsections\":[{\"id\":\"email-description\",\"title\":\"a) Description and scope of data processing\",\"content\":\"$f7\"},{\"id\":\"email-legal-basis\",\"title\":\"b) Legal basis for data processing\",\"list\":[\"\u003cstrong\u003eArt. 6(1)(a) GDPR (consent)\u003c/strong\u003e for sending newsletters/marketing emails under the double-opt-in procedure and for statistical reach measurement;\",\"\u003cstrong\u003eArt. 6(1)(b) GDPR (contract/pre-contractual measures)\u003c/strong\u003e for transactional emails (e.g., system-required notices, account/project communication);\",\"\u003cstrong\u003e§ 7(3) UWG (existing customer advertising)\u003c/strong\u003e, where permissible, for sending similar offers to existing customers.\"]},{\"id\":\"email-purpose\",\"title\":\"c) Purpose of data processing\",\"content\":\"Processing serves email delivery, subscription management, documentation of your consent (proof), optimization of our communications (e.g., topic/frequency control), and measurement of the reach/success of our emails (aggregated statistics, error messages, deliverability).\"},{\"id\":\"email-storage\",\"title\":\"d) Storage period\",\"content\":\"We store your email data until you withdraw consent/unsubscribe from the respective mailing list and—where necessary—for proof purposes (consent records) for up to 3 years after the last mailing/withdrawal (Art. 5(2) GDPR — accountability; § 7 UWG). Logs of transactional emails are retained in accordance with statutory retention periods and/or IT security requirements and are then deleted or anonymized. Mailchimp deletes or anonymizes data according to contractual requirements and on our instructions.\"},{\"id\":\"email-objection\",\"title\":\"e) Right to object and deletion options\",\"content\":\"You can withdraw your consent at any time with effect for the future (e.g., via the unsubscribe link in every email or by email to info@huerray.de). You may object to existing customer advertising at any time. Processing of transactional emails is necessary for contract performance; there is no option to unsubscribe from these where legally/contractually required.\"}]},{\"id\":\"registration-data\",\"title\":\"8. Data You Provide Upon Registration, Contract Conclusion, and Use of Our Online Services\",\"subsections\":[{\"id\":\"registration-description\",\"title\":\"a) Description and scope of data processing\",\"content\":\"When you first register and create an account, and when you use our online services (e.g., customer/creator dashboard, briefing/upload functions, ordering/booking processes), we ask you to provide personal data. We transparently indicate which information is mandatory (required fields) and which is voluntary.\u003cbr/\u003e\u003cbr/\u003eData that may be collected includes in particular:\",\"list\":[\"\u003cstrong\u003eIdentity and contact data:\u003c/strong\u003e first and last name, if applicable artist/creator name, address(es), email address, phone number(s), company name/role (for business customers), preferred language.\",\"\u003cstrong\u003eAccess data:\u003c/strong\u003e username, password (stored exclusively in encrypted form), where applicable security/verification attributes.\",\"\u003cstrong\u003eContract/transaction data:\u003c/strong\u003e information about the legal transaction (offer, order, contract texts, terms, cancellations), project/order IDs, briefings/approvals, acceptances, project communication, billing/payment status.\",\"\u003cstrong\u003eBilling/payment data:\u003c/strong\u003e billing and delivery address, VAT ID (if applicable), bank details/IBAN/BIC or payment service provider IDs.\",\"\u003cstrong\u003eConsent and proof data:\u003c/strong\u003e declarations of consent (e.g., newsletter/tracking, publications), double-opt-in timestamps, consent/withdrawal logs.\",\"\u003cstrong\u003eProfile/convenience information (voluntary):\u003c/strong\u003e profile photo/avatar, social media handles, topic preferences, portfolio links, settings.\"],\"additionalContent\":\"In the course of contract performance, your personal data may be shared with third parties where necessary for the respective contract processing or project implementation (e.g., hosting/IT providers, email/newsletter provider Mailchimp, payment/banking service providers, logistics/file transfer and, in the creator context, customers/partners if required for briefing, approvals, acceptances, or proof of use). We have data processing agreements with processors pursuant to Art. 28 GDPR.\"},{\"id\":\"registration-legal-basis\",\"title\":\"b) Legal basis for data processing\",\"list\":[\"\u003cstrong\u003eArt. 6(1)(b) GDPR (contract/pre-contractual measures)\u003c/strong\u003e for mandatory information and all processing necessary to provide the account, enable the functions, and perform contracts.\",\"\u003cstrong\u003eArt. 6(1)(a) GDPR (consent)\u003c/strong\u003e for voluntary information, newsletter/marketing communications, and publication of content where not already contractually owed.\",\"\u003cstrong\u003eArt. 6(1)(c) GDPR (legal obligation)\u003c/strong\u003e e.g., for tax/commercial retention obligations.\",\"\u003cstrong\u003eArt. 6(1)(f) GDPR (legitimate interests)\u003c/strong\u003e e.g., for IT and account security, abuse/fraud prevention, internal administration, and legal enforcement; your interests are carefully balanced.\"]},{\"id\":\"registration-purpose\",\"title\":\"c) Purpose of data processing\",\"content\":\"Processing enables and manages your account and the use of the respective offerings/functions (e.g., briefing, content upload, contract processing, reporting), communication (inquiries, support), personalization/convenient use (where voluntary information is provided), as well as proper billing and compliance with legal obligations.\"},{\"id\":\"registration-storage\",\"title\":\"d) Storage period\",\"content\":\"We process the data for as long as necessary for the purposes mentioned:\",\"list\":[\"\u003cstrong\u003eAccount/profile data:\u003c/strong\u003e until the account is deleted by you or us (in accordance with the contractual/terms of use) and thereafter insofar as statutory retention obligations exist.\",\"\u003cstrong\u003eContract/billing documents:\u003c/strong\u003e generally 6 to 10 years in accordance with the German Commercial Code (HGB) / Fiscal Code (AO).\",\"\u003cstrong\u003eConsent logs:\u003c/strong\u003e for proof purposes up to 3 years after withdrawal/unsubscription. After the purposes cease to apply, data is deleted or—where technically possible and legally permissible—anonymized.\"]},{\"id\":\"registration-objection\",\"title\":\"e) Right to object and deletion options\",\"content\":\"Where we process data based on your consent or due to voluntary information, you may withdraw consent at any time with future effect and/or delete/adjust voluntary details yourself in your account. There is no withdrawal option for mandatory contract/system data where this is required to provide the services or fulfill legal obligations. Your rights to object under Art. 21 GDPR remains unaffected (e.g., against processing based on legitimate interests). Please address withdrawals/objections to datenschutz@huerray.de.\"}]},{\"id\":\"advertising-without-consent\",\"title\":\"9. Advertising Without Consent (Existing Customer Advertising under § 7(3) UWG)\",\"subsections\":[{\"id\":\"advertising-description\",\"title\":\"a) Description and Scope of Data Processing\",\"content\":\"If you have created an account with us or used one of our services, we consider you an existing customer. Within this framework, we may process your postal contact details (name, address) — even without separate consent — to send you information about our own, similar products or services. We may also use your email address to send you our own, similar offers, provided that we obtained it in connection with the sale of a product or service. Voluntary information (e.g., interests) may be used to tailor content to your preferences. No data will be passed on to third parties for their own advertising purposes; processors are used in accordance with Art. 28 GDPR.\"},{\"id\":\"advertising-legal-basis\",\"title\":\"b) Legal Basis\",\"content\":\"Processing is carried out on the basis of Art. 6(1)(f) GDPR (legitimate interest in direct marketing) in conjunction with § 7(3) UWG (email advertising to existing customers for similar goods/services). We perform a balancing of interests and fully respect your right to object at any time.\"},{\"id\":\"advertising-purpose\",\"title\":\"c) Purpose of Processing\",\"content\":\"Direct marketing for our own, similar products and services, and the provision of related information.\"},{\"id\":\"advertising-storage\",\"title\":\"d) Storage Duration\",\"content\":\"We process the contact and usage data required for this purpose for as long as the customer relationship exists, until you object, or — where applicable — in accordance with the principles and legal retention periods described in Section 14 (Storage Period and Criteria).\"},{\"id\":\"advertising-objection\",\"title\":\"e) Right to Object and Deletion Options\",\"content\":\"You can object to the use of your data for advertising purposes at any time. For emails, please use the unsubscribe link provided or contact datenschutz@huerray.de; for postal advertising, you can likewise object at any time.\"}]},{\"id\":\"ugc-uploads\",\"title\":\"10. UGC Uploads, Review, Publication \u0026 Provision to Business Clients\",\"content\":\"$f8\",\"subsections\":[]},{\"id\":\"recipients-third-country\",\"title\":\"11. Recipients, Third-Country Transfers \u0026 Safeguards\",\"content\":\"\u003cstrong\u003eRecipients:\u003c/strong\u003e\u003cbr/\u003eInternal departments (Operations, Creator Success, Sales, Finance), contracted processors (hosting/IT, email/newsletter, payment services, file transfer, CRM/ticket systems), and — within project contexts — business clients/partners.\u003cbr/\u003e\u003cbr/\u003e\u003cstrong\u003eThird Countries:\u003c/strong\u003e\u003cbr/\u003eIf data is transferred to third countries (outside the EEA), e.g., to Mailchimp (USA), such transfers are based on appropriate safeguards, in particular Standard Contractual Clauses (SCCs), and additional technical and organizational protection measures, limited to what is necessary. \u003cbr /\u003e\u003cbr /\u003eDetails can be provided upon request.\",\"subsections\":[]},{\"id\":\"social-media\",\"title\":\"12. Social Media Pages \u0026 Communication Channels\",\"content\":\"When you interact with our social media pages, we process the information you provide to handle your inquiry. In addition, the respective platform providers' privacy policies apply. Depending on the platform, joint controllership may exist under data protection law.\",\"subsections\":[]},{\"id\":\"security\",\"title\":\"13. Security\",\"content\":\"We implement technical and organizational security measures in line with current industry standards (e.g., encryption, access control, logging, hardening/monitoring) to ensure an appropriate level of protection corresponding to the risk.\",\"subsections\":[]},{\"id\":\"storage-period\",\"title\":\"14. Storage Period and Criteria\",\"content\":\"We store personal data only for as long as necessary to fulfill the respective purposes or as required by statutory/contractual obligations (typically 6–10 years for tax and commercial documentation). Afterwards, we delete or anonymize the data. Consent records may be retained for up to 3 years after withdrawal (accountability obligation).\",\"subsections\":[]},{\"id\":\"data-subject-rights\",\"title\":\"15. Data Subject Rights\",\"content\":\"If your personal data is processed, you are a data subject within the meaning of the GDPR and have the following rights toward the controller:\",\"subsections\":[{\"id\":\"right-of-access\",\"title\":\"Right of Access\",\"content\":\"You have the right to obtain confirmation as to whether or not personal data concerning you is being processed. If so, you may request access to the following information:\u003cbr/\u003e\u003cbr/\u003e\",\"orderedList\":[\"the purposes of the processing;\",\"the categories of personal data concerned;\",\"the recipients or categories of recipients to whom your personal data has been or will be disclosed;\",\"the envisaged period of storage or, if specific information is not possible, the criteria used to determine that period;\",\"the existence of the right to rectification, erasure, or restriction of processing, or the right to object to such processing;\",\"the existence of a right to lodge a complaint with a supervisory authority;\",\"where the personal data is not collected from you, any available information as to its source;\",\"the existence of automated decision-making, including profiling under Art. 22(1) and (4) GDPR, and—at least in those cases—meaningful information about the logic involved as well as the significance and envisaged consequences of such processing.\"],\"additionalContent\":\"You also have the right to be informed whether your data is transferred to a third country or an international organization and to be informed of the appropriate safeguards under Art. 46 GDPR relating to such transfers.\"},{\"id\":\"right-to-rectification\",\"title\":\"Right to Rectification\",\"content\":\"You have the right to obtain the rectification of inaccurate personal data and the completion of incomplete data without undue delay.\"},{\"id\":\"right-to-restriction\",\"title\":\"Right to Restriction of Processing\",\"content\":\"You may request the restriction of processing of your personal data under the following conditions:\",\"orderedList\":[\"you contest the accuracy of your personal data for a period enabling us to verify its accuracy;\",\"the processing is unlawful, but you oppose deletion and request restriction instead;\",\"we no longer need the data for processing purposes, but you require it for the establishment, exercise, or defense of legal claims; or\",\"you have objected to processing under Art. 21(1) GDPR, pending verification of whether our legitimate grounds override yours.\"],\"additionalContent\":\"Where processing is restricted, the data may—apart from storage—only be processed with your consent, for legal claims, to protect the rights of another person, or for important public interest reasons. You will be informed before any restriction is lifted.\"},{\"id\":\"right-to-erasure\",\"title\":\"Right to Erasure (\\\"Right to be Forgotten\\\")\",\"subsections\":[{\"id\":\"obligation-to-erase\",\"title\":\"a) Obligation to Erase\",\"content\":\"You may request the immediate deletion of your personal data, and we are obliged to delete it without undue delay if one of the following applies:\",\"orderedList\":[\"the data is no longer necessary for the purposes for which it was collected or processed;\",\"you withdraw your consent and there is no other legal basis for processing;\",\"you object to the processing under Art. 21(1) or (2) GDPR and there are no overriding legitimate grounds;\",\"the data was unlawfully processed;\",\"deletion is required to comply with a legal obligation under EU or Member State law;\",\"the data was collected in relation to information society services under Art. 8(1) GDPR.\"]},{\"id\":\"notification-to-third-parties\",\"title\":\"b) Notification to Third Parties\",\"content\":\"Where we have made personal data public and are obliged to erase it, we will take reasonable steps, including technical measures, to inform controllers processing the data that you have requested deletion of all links to, copies, or replications of such data.\"},{\"id\":\"exceptions\",\"title\":\"c) Exceptions\",\"content\":\"The right to erasure does not apply if processing is necessary:\u003cbr/\u003e\u003cbr/\u003e1. for exercising the right of freedom of expression and information;\u003cbr/\u003e2. for compliance with a legal obligation or performance of a public interest task;\u003cbr/\u003e3. for reasons of public interest in the area of public health (Art. 9(2)(h, i) and (3) GDPR);\u003cbr/\u003e4. for archiving, scientific, historical, or statistical purposes (Art. 89(1) GDPR) where erasure would seriously impair those purposes; or\u003cbr/\u003e5. for the establishment, exercise, or defense of legal claims.\"}]},{\"id\":\"right-to-notification\",\"title\":\"Right to Notification\",\"content\":\"If you have exercised your right to rectification, erasure, or restriction of processing, we will inform all recipients to whom the personal data has been disclosed, unless this proves impossible or involves disproportionate effort. You have the right to be informed about those recipients.\"},{\"id\":\"right-to-data-portability\",\"title\":\"Right to Data Portability\",\"content\":\"You have the right to receive the personal data you have provided to us in a structured, commonly used, and machine-readable format, and the right to transmit that data to another controller without hindrance, where:\",\"orderedList\":[\"the processing is based on consent (Art. 6(1)(a) or Art. 9(2)(a) GDPR) or on a contract (Art. 6(1)(b) GDPR); and\",\"the processing is carried out by automated means.\"],\"additionalContent\":\"You also have the right to have your data transmitted directly from one controller to another, where technically feasible and provided that the rights of others are not adversely affected. This right does not apply to processing necessary for the performance of a task carried out in the public interest or under official authority.\"},{\"id\":\"right-to-object\",\"title\":\"Right to Object\",\"content\":\"You have the right to object at any time, on grounds relating to your particular situation, to the processing of your personal data based on Art. 6(1)(e) or (f) GDPR, including profiling based on those provisions.\u003cbr/\u003e\u003cbr/\u003eWe will no longer process your personal data unless we can demonstrate compelling legitimate grounds that override your interests or the processing serves the establishment, exercise, or defense of legal claims.\u003cbr/\u003e\u003cbr/\u003eIf your personal data is processed for direct marketing, you may object at any time to such processing, including profiling related to direct marketing. If you object, your personal data will no longer be processed for these purposes.\u003cbr/\u003e\u003cbr/\u003eYou can exercise your right to object using automated procedures (e.g., unsubscribe links) that use technical specifications, regardless of Directive 2002/58/EC.\"},{\"id\":\"right-to-withdraw-consent\",\"title\":\"Right to Withdraw Consent\",\"content\":\"You have the right to withdraw your consent at any time. The withdrawal does not affect the lawfulness of processing based on consent before its withdrawal.\"},{\"id\":\"automated-decision-making\",\"title\":\"Automated Individual Decision-Making, Including Profiling\",\"content\":\"You have the right not to be subject to a decision based solely on automated processing—including profiling—that produces legal effects concerning you or similarly significantly affects you, except where:\",\"orderedList\":[\"it is necessary for entering into or performing a contract between you and us;\",\"it is authorized by Union or Member State law providing suitable safeguards; or\",\"it is based on your explicit consent.\"],\"additionalContent\":\"Such decisions may not be based on special categories of personal data unless Art. 9(2)(a) or (g) GDPR applies and appropriate measures are taken to safeguard your rights and interests.\u003cbr/\u003e\u003cbr/\u003eIn the cases referred to in (1) and (3), we will implement suitable measures to protect your rights and freedoms, including the right to human intervention, to express your point of view, and to contest the decision.\"},{\"id\":\"right-to-lodge-complaint\",\"title\":\"Right to Lodge a Complaint with a Supervisory Authority\",\"content\":\"Without prejudice to any other administrative or judicial remedy, you have the right to lodge a complaint with a supervisory authority—particularly in the Member State of your residence, workplace, or the alleged infringement—if you consider that the processing of your personal data violates the GDPR.\u003cbr/\u003e\u003cbr/\u003eThe supervisory authority with which the complaint has been lodged will inform you of the progress and outcome of the complaint, including the possibility of judicial remedy under Art. 78 GDPR.\"}]}]},\"terms-and-conditions\":{\"page\":{\"title\":\"General Terms and Conditions\"},\"seo\":{\"title\":\"General Terms and Conditions\",\"description\":\"General Terms and Conditions (GTC) for the use of the Huerray platform by brands and content creators.\",\"keywords\":\"terms and conditions, GTC, platform terms, usage agreement, Huerray, legal terms, brand agreement\"},\"effectiveDateTitle\":\"Effective as of\",\"effectiveDate\":\"October 21, 2025\",\"tableOfContents\":\"Table of Contents\",\"sections\":[{\"id\":\"preamble\",\"title\":\"Preamble\",\"content\":[\"Thrypes operates the online platform Huerray (hereinafter \\\"Platform\\\"). Access to the Platform is provided via the website \u003ca href='https://huerray.com'\u003ewww.huerray.com\u003c/a\u003e (hereinafter \\\"Website\\\").\",\"Thrypes enables interested companies, agencies, or brands (each hereinafter referred to as \\\"Brand\\\" or collectively as \\\"Brands\\\") to commission the creation of video, photo, or other digital content (hereinafter \\\"Content\\\") by independent, externally contracted content creators (hereinafter \\\"Creator\\\" or \\\"Creators\\\") and to acquire usage rights thereto in accordance with the following terms and conditions.\",\"The Platform serves as a medium for the facilitation, execution, and management of content creation orders (\\\"UGC Orders\\\") between Brands and Creators. We provide the technical infrastructure, communication and payment processing, as well as the contractual framework necessary to ensure secure, transparent, and efficient collaboration.\",\"The following General Terms and Conditions (hereinafter \\\"Huerray Brand GTC\\\") govern the use of the Platform by Brands, the legal relationship concerning the commissioning and creation of Content, as well as all other legal relationships between Thrypes and the Brand.\",\"By registering or using the Platform, the Brand acknowledges these GTC as binding.\"],\"subsections\":[]},{\"id\":\"scope\",\"title\":\"1. Scope of Application\",\"content\":[\"(1) These Huerray Brand GTC govern the legal relationship between Thrypes and the registered Brands that use the Huerray Platform to commission content creation services.\",\"(2) Individually agreed terms between Thrypes and the Brand take precedence over these Brand GTC. Unless proven otherwise, a contract concluded in text form or a corresponding written confirmation by us shall be decisive for the content of such agreements.\",\"(3) Separate terms of use (\\\"Huerray Creator GTC\\\") apply to Creators and can be accessed via the Platform.\",\"(4) Only entrepreneurs within the meaning of Section 14 of the German Civil Code (BGB) may act as Brands. An entrepreneur is a natural or legal person or a partnership with legal capacity who, when entering into a legal transaction, acts in the exercise of their commercial or independent professional activity.\",\"(5) Any general terms and conditions of the Brand that conflict with or deviate from these Huerray Brand GTC shall not be recognized, even if We do not expressly object to their validity in individual cases.\"]},{\"id\":\"subject-of-service\",\"title\":\"2. Subject of Service\",\"content\":[\"(1) We enable Brands to place content creation orders (\\\"Orders\\\") via the Platform. In accordance with each specific Order and the briefing provided by the Brand, Thrypes will produce the ordered digital content (\\\"Content\\\") through an externally contracted Creator or—optionally—an automated AI Creator, in line with the agreed specifications. Upon acceptance of the Content in accordance with paragraph 6 of these GTC, Thrypes grants the Brand the contractually agreed usage rights to the Content in exchange for payment as defined in paragraph 5.\",\"(2) The Content is primarily intended for the Brand's online marketing purposes, including the promotion of its products or services through social media activities, websites, digital advertising campaigns, or other marketing initiatives\",\"(3) Access to the Platform is obtained by creating a user account (“Account”) on the website www.huerray.de and providing the necessary information. During registration, the Brand must accept these Huerray Brand GTC. After successful registration, the Brand may access and use the services offered by Us.\",\"(4) To initiate Content creation, the Brand submits a binding Order via the Platform to Us. We will subcontract the selected Creator or AI Creator—chosen or approved by the Brand via the Platform—to produce the Content. Once completed, the Content will be made available to the Brand electronically for download via the Platform.\",\"$f9\",\"(7) Thrypes reserves the right to expand, adapt, or reasonably limit the Platform and its services at any time, provided that the primary obligations of existing Orders are not significantly affected.\"]},{\"id\":\"conclusion-of-contract\",\"title\":\"3. Conclusion of Contract\",\"content\":[\"(1) By submitting a specific Order via email or on the platform or confirming an offer provided by Us in writing, or via the platform, the Brand submits a binding offer to conclude a contract for the creation of Content in accordance with the provided Briefing with Thrypes, and acknowledges the applicability of this Huerray Brand GTC to the Order. \",\"$fa\",\"(3) Thrypes is not obliged to accept an Order. In particular, we may reject Orders: \u003cbr /\u003e\u003cul class='mb-4 ml-6'\u003e \u003cli class='mb-4'\u003ea. if the Order violates applicable law, third-party rights, ethical guidelines, or Platform principles;\u003c/li\u003e \u003cli class='mb-4'\u003eb. if the requested Creator or AI Creator is unavailable or declines the Order; or \u003c/li\u003e \u003cli class='mb-4'\u003ec. if there are justified doubts about the Brand’s solvency or credibility.\u003c/li\u003e \u003c/ul\u003e(4) Upon acceptance of the Order by Us, a Creator or AI Creator will be assigned, either:\u003cul class='mb-4 ml-6'\u003e \u003cli class='mb-4'\u003ea. through active selection by the Brand, or\u003c/li\u003e\u003cli class='mb-4'\u003eb. through automated suggestions or assignments via our internal matching system.\u003c/li\u003e \u003c/ul\u003eOnce the Brand approves a Creator, an automatic invitation is sent to the Creator to join the campaign. The Creator must accept this invitation to confirm the Order. For AI Creators, approval occurs automatically within the system.\",\"(5) During an ongoing Order, the Brand may purchase additional paid services (e.g., alternative formats, extra versions, special edits). Such contract amendments and any price adjustments will be confirmed by Us in writing and documented within the Account or Order communication.\",\"(6) Any guarantees regarding specific characteristics of the Content or its performance (e.g., reach, engagement rate) is outside the scope of the services we offer.\",\"(7) Our services do not include legal review or advice, particularly regarding trademark, copyright, competition, or advertising law. Thrypes also assumes no responsibility for the Brand’s compliance with legal information obligations (e.g., advertising disclosure requirements).\",\"(8) After the conclusion of the contract, Thrypes sends the Brand an Order confirmation including all relevant contract information, these GTC, and the privacy policy to the email address provided.\",\"Information about the contractual relationship and Order status can also be viewed in the user account on the Platform. The contract text is stored in compliance with data protection regulations.\"]},{\"id\":\"user-account\",\"title\":\"4. Opening of a User Account\",\"content\":[\"(1) Before using the Platform, each Brand must open a user account (“Account”) and provide all required information fully and truthfully. The Brand is the holder of the Account. Within one Account, multiple members (e.g., employees of the Brand or an appointed agency) may be created and managed.\",\"(2) When opening an Account, the acting person must have full legal capacity and be authorized to act on behalf of and in the name of the Brand. Opening an Account on behalf of third parties or unauthorized persons is prohibited. \",\" (3) If an Account is opened for a legal entity or partnership, the acting person must be duly authorized to represent it. In this case, the represented legal entity or partnership shall be deemed the “User” within the meaning of these GTC. \",\" (4) During registration, the Brand creates login credentials (username and password). These credentials also apply to any members within the Account and must be kept confidential. The Brand is required to implement appropriate security measures to prevent unauthorized access by third parties. \",\" (5) After successful creation of the Account, the Brand gains access to the services offered by Us via the Platform. Where services are subject to a fee, a separate Order in accordance with Section 4 of these GTC is required. \",\" (6) The authorization to use the Platform and related services applies exclusively to the Brand as the Account holder and its authorized members. Sharing personal login credentials with third parties is not permitted. In case of suspicion or knowledge of unauthorized access, we must be notified immediately via email at service@huerray.de. We are entitled to temporarily suspend the Account until the issue is resolved.\",\"  (7) The Brand must ensure that the technical requirements for using the Platform are met (e.g., stable internet connection, up-to-date browser version, compatible devices). The provision and maintenance of the necessary hardware, software, and internet access are the sole responsibility of the Brand.\",\"  (8) We strive to make the Platform available without interruptions. However, uninterrupted availability cannot be guaranteed. Maintenance, security, or capacity work, as well as technical issues, may lead to temporary interruptions. We will make reasonable efforts to minimize such interruptions and, where possible, provide advance notice. \",\" (9) The Brand agrees not to upload or transmit any content or files containing malware (e.g., viruses, trojans, or harmful scripts) when using the Platform. In the event of a culpable breach, the Brand shall be liable for any resulting damages and may be excluded from further use of the Platform.\"]},{\"id\":\"compensation\",\"title\":\"5. Compensation, Payment, and Cancellation\",\"content\":[\"(1) Upon placing an Order, the Brand owes payment of the full agreed fee. The amount of the fee plus statutory VAT will be communicated to the Brand in the offer or Order confirmation issued by us. The fee may be increased if the Brand requests or agrees to additional or extended services during the ongoing Order (e.g., extra versions, alternative formats, or special edits).\",\"(2) Payment is generally due after we issue an invoice. Invoices are provided to the Brand electronically (via email or within the user account) and must be paid within 14 days from the invoice date without deduction. We reserve the right to execute individual Orders only against advance payment.\",\"(3) Payments may be processed via Stripe, Inc. \u003ca href='https://stripe.com' title='Stripe'\u003e   (https://stripe.com)\u003c/a\u003e or a comparable service provider. If Stripe is used, its terms of service apply in addition. The Brand’s payment data may be stored in the Account and used for future transactions if the Brand provides consent.\u003cbr /\u003e\u003cbr /\u003e (4) Cancellation before Order acceptance: The Brand may cancel an Order free of charge before it is accepted by us by contacting us via email at \u003ca href='mailto:service@huerray.de' title='service@huerray.de'\u003eservice@huerray.de\u003c/a\u003e or requested cancellation via the platform.\",\"$fb\",\"(9) If the Brand defaults on payment, Thrypes is entitled to: \u003cul class='ml-8'\u003e\u003cli class='mb-4'\u003ea. withhold ongoing services, \u003c/li\u003e\u003cli class='mb-4'\u003eb. temporarily suspend the Brand’s access to the Platform, and \u003c/li\u003e\u003cli class='mb-4'\u003ec. charge default interest at 9 percentage points above the base rate (Section 288(2) BGB).\u003c/li\u003e\u003c/ul\u003eFurther statutory or contractual claims by Thrypes remain unaffected.\",\"(10) Offsetting against counterclaims by the Brand is permitted only if such claims are legally established or undisputed. A right of retention may only be asserted with respect to claims arising from the same contractual relationship.\"]},{\"id\":\"acceptance-rights\",\"title\":\"6. Acceptance and Transfer of Rights\",\"content\":[\"(1) The Content created by Thrypes or by the commissioned Creator or AI Creator will be made available to the Brand for review and acceptance via the Platform upon completion. From the moment the final Content is uploaded, the Brand has 7 days to review the delivered Content and either \u003cul class='ml-8'\u003e\u003cli class='mb-4'\u003ea. declare acceptance, or\u003c/li\u003e \u003cli class='mb-4'\u003e b. request a revision if the Content objectively deviates from the agreed Briefing.\u003c/li\u003e \u003c/ul\u003eIf no response is received within this period, the delivered Content shall be deemed automatically accepted\",\"(2) Downloading and permanently storing the Content (e.g., as photo or video files) is only possible once the Brand has declared acceptance or automatic acceptance under paragraph (1) has taken effect.\",\"(3) Upon acceptance of the Content, Thrypes grants the Brand an exclusive, unlimited, transferable, and worldwide right of use to the Content. This right includes all known and future types of use and in particular the following:\",{\"list\":[\"the right to reproduce, publish, and distribute the Content in physical or digital form;\",\"the right of public performance and communication to the public, including online and social media use (e.g., Instagram, TikTok, YouTube, Facebook, LinkedIn);\",\"the right to use, store, and exploit the Content in data networks, online services, and media libraries, including making it available for viewing or download;\",\"the right to edit, adapt, or combine the Content with other materials (e.g., text, graphics, music, product images), provided that the legitimate interests of the Creator are not violated;\",\"the right to use the Content for editorial or commercial purposes in print, online, TV, outdoor, or cinema advertising, PR, product packaging, POS materials, and all related campaigns;\",\"the right to use the Content for the Brand’s own marketing purposes, such as presentations, case studies, or portfolio showcases.\"]},\"(4) The Brand may grant third parties usage rights or sublicenses to the Content to the extent necessary or customary within the agreed scope of use.\",\"(5) The Brand may edit, modify, or transfer the Content into other media formats (e.g., montage, text integration, color adjustment, combination with music or product images) provided that the Creator’s personal rights are respected and the original meaning or context of the Content is not distorted.\",{\"content\":\"(6) The granting of rights under paragraphs (3) to (5) expressly excludes any right to use the Content, in whole or in part, for or in connection with artificial intelligence systems (“AI Systems”), including:\",\"list\":[\"using the Content as training, validation, or test data for any AI system,\",\"inputting the Content as a prompt or input into an AI system, or\",\"using or publishing any AI-generated output based on the Content. These rights remain exclusively with Thrypes GmbH and are not transferred to the Brand.\"]},\"(7) Thrypes grants the rights described in paragraph (3) only after full payment of the agreed fee. Until payment is made in full, the Brand only receives a simple, revocable right of use limited to internal review and coordination purposes.\",{\"content\":\"(8) The Brand grants Thrypes a non-exclusive, unlimited right of use to the created Content or excerpts thereof for Thrypes’s own promotional, PR, and marketing communication purposes. This right includes, in particular:\",\"list\":[\"use on the Huerray website, in presentations, brochures, advertisements, and social media;\",\"publication of case studies; and\",\"identifying the Brand as a reference client. We will ensure that the legitimate interests of the Brand are appropriately protected in such cases.\"]}]},{\"id\":\"production-materials\",\"title\":\"7. Production Materials\",\"content\":[\"(1) If the Brand provides production materials (e.g., product samples or other items) for Content creation, ownership
