 of these materials transfers to us upon handover. This also applies if the Brand delivers the materials directly to a Creator or AI Creator. The Brand has no claim for return or replacement against Thrypes in this context.\",\"(2) Upon the Brand’s written request, Thrypes will make reasonable efforts to return production materials or any remaining parts thereof after the Content has been completed, provided that this is technically and logistically feasible and the materials have not been consumed or destroyed during production. However, there is no legal entitlement to the return of such materials.\",\"(3) We are under no obligation to store, insure, or protect the production materials against damage or loss. Thrypes assumes no liability for the destruction, damage, or loss of materials during transport, storage, or production unless caused intentionally or by gross negligence.\",\"(4) Production materials used by Creators or AI Creators in the course of Content creation may be photographed, filmed, modified, or consumed to the extent necessary or customary to fulfill the Order.\"],\"subsections\":[]},{\"id\":\"conduct-obligations\",\"title\":\"8. General Conduct Obligations\",\"content\":[\"$fc\",\"(2) The Brand also agrees not to use the Huerray Platform for purposes that could harm the reputation, integrity, or functionality of the Platform or its users. This includes, in particular, unauthorized access to data, circumvention of technical protection measures, distribution of malware, or misuse of communication features.\",\"(3) We are entitled to temporarily block or permanently delete the Brand’s content or orders if they violate the obligations described in paragraphs (1) or (2) or if such a violation appears sufficiently likely.\",\"(4) If the Brand culpably violates its conduct obligations, it shall be liable to Thrypes for all resulting damages, including potential third-party claims (e.g., due to legal violations).\"],\"subsections\":[]},{\"id\":\"termination\",\"title\":\"9. Termination and End of Contract\",\"content\":[\"(1) The contract between Thrypes GmbH and the Brand is concluded for an indefinite period and may be terminated by either party with 14 days’ notice to the end of a month, in text form.\",\"(2) The right to terminate without notice for good cause remains unaffected. Good cause exists in particular if: \u003cul class='ml-8'\u003e \u003cli class='mb-4'\u003ea. the Brand is in default of payment despite a reminder;\u003c/li\u003e \u003cli class='mb-4'\u003eb. the Brand seriously breaches its obligations under these GTC, particularly under § 8 (Conduct Obligations); or\u003c/li\u003e \u003cli class='mb-4'\u003ec. insolvency proceedings are opened or applied for against the Brand’s assets.\u003c/li\u003e\u003c/ul\u003e\",\"(3) Upon the effective date of termination, the Brand’s access to the Platform will be blocked. Ongoing Orders will be completed properly, insofar as possible. Payment claims already incurred remain in effect.\"]},{\"id\":\"warranty\",\"title\":\"10. Warranty\",\"content\":[\"(1) Thrypes produces the commissioned Content in accordance with the Brand’s Briefing and with the level of care customary in commercial practice. Thrypes does not guarantee specific advertising results or reach.\",\"(2) Complaints regarding the delivered quality must be submitted to us immediately, but no later than 7 days after the Content is made available, in writing. If no complaint is received within this period, the Content shall be deemed accepted as contractually compliant.\",\"(3) Thrypes shall not be liable for defects resulting from incorrect, incomplete, or misleading information provided by the Brand in the Briefing or materials submitted.\",\"(4) If a defect attributable to us exists, we will, at our discretion, either correct or recreate the Content. If rectification fails twice, the Brand may request an appropriate reduction in payment.\",\"(5) No further warranty rights exist unless mandatory statutory provisions provide otherwise.\"],\"subsections\":[]},{\"id\":\"liability\",\"title\":\"11. Limitation of Liability and Responsibility\",\"content\":[\"(1) Our liability within this contractual relationship is conclusively defined as follows: \u003cul class='ml-8'\u003e \u003cli class='mb-4'\u003ea. We are liable without limitation for intent and gross negligence, as well as for damages resulting from injury to life, body, or health.\u003c/li\u003e \u003cli class='mb-4'\u003eb. In cases of slight negligence, we are only liable for breaches of essential contractual obligations. An essential contractual obligation within the meaning of this clause is an obligation whose fulfillment enables proper execution of the contract and on which the Brand regularly relies. In such cases, liability is limited to the foreseeable, typical damage that could reasonably be expected at the time the contract was concluded.\u003c/li\u003e\u003c/ul\u003e\",\"(2) The above limitations of liability also apply in favor of our employees, representatives, agents, and subcontractors.\",\"(3) Liability for assumed guarantees and for claims arising from mandatory statutory provisions—particularly under the Product Liability Act or in cases of data protection violations—remains unaffected.\",\"(4) To the extent the Brand has claims against third parties (e.g., manufacturers, platforms, service providers, or agencies), such claims shall take precedence. The Brand must first pursue damages against the third party. Upon request, we will assign any related rights it holds against such third parties to the Brand for enforcement.\",\"(5) we reserve the right to assert contributory negligence. In particular, the Brand is obliged to: \u003cul class='ml-8'\u003e \u003cli class='mb-4'\u003e– regularly back up its own data according to the current state of technology, and\u003c/li\u003e \u003cli class='mb-4'\u003e– take appropriate measures to protect against malware and unauthorized access.\u003c/li\u003e \u003c/ul\u003e These obligations apply unless data backup is expressly part of Thrypes’s contractual services.\",\"(6) Claims for defects or damages expire twelve (12) months after the statutory limitation period begins, unless the defect was fraudulently concealed or mandatory statutory provisions stipulate longer limitation periods.\"]},{\"id\":\"confidentiality\",\"title\":\"12. Confidentiality\",\"content\":[\"(1) Both contracting parties agree to keep all confidential information obtained in connection with this contract secret and to use it solely for the fulfillment of contractual purposes.\",\"(2) \\\"Confidential information\\\" includes all information, documents, and data designated as confidential or which, by their nature, should reasonably be regarded as confidential. Thrypes grants access only to employees who are necessary for service delivery and who are bound by confidentiality obligations.\",\"(3) If either party is required by an authority or public body to disclose confidential information, the other party must be informed in advance, insofar as legally permissible.\",\"(4) The duty of confidentiality continues beyond the termination of the contract. Upon request after contract termination, confidential information must be returned or deleted, unless statutory retention obligations prevent this.\"]},{\"id\":\"protection-of-rights\",\"title\":\"13. Protection of Our Rights and Contractual Penalty\",\"content\":[\"(1) The Brand is prohibited from using, removing, altering, or obscuring any of our copyrights, trademarks, or proprietary notices outside the scope of the contractual authorization.\",\"(2) The Brand is further prohibited from independently modifying the created Content or any of its components after acceptance, unless such modification has been expressly authorized in the contract.\",\"(3) If contact between the Brand and a Creator is established for the first time through Thrypes, the Brand is prohibited from entering into a direct cooperation or contractual relationship with that Creator outside the Platform for a period of three (3) months after completion of the respective Order.\",\"(4) Any breach of paragraph (3) entitles Thrypes to suspend the Brand’s Account and to demand a contractual penalty equal to three times the agreed Content fee. Thrypes reserves the right to assert further claims for injunctive relief and damages.\"],\"subsections\":[]},{\"id\":\"amendments\",\"title\":\"14. Amendments to the GTC\",\"content\":[\"(1) We reserve the right to amend these GTC at any time with future effect, provided that such amendments are reasonable for the Brand. Amendments may occur in particular if they \u003cul class='ml-8'\u003e \u003cli class='mb-4'\u003ea. implement legal requirements,\u003c/li\u003e \u003cli class='mb-4'\u003eb. comply with administrative or judicial decisions, or\u003c/li\u003e \u003cli class='mb-4'\u003ec. relate to new services or features without unreasonably disadvantageing the Brand.,\u003c/li\u003e\u003c/ul\u003e\",\"(2) We will notify the Brand of any amendments by email at least four weeks before they take effect.\",\"(3) If the Brand does not object to the amendments within four weeks of receiving the notification, the amendments shall be deemed accepted. Thrypes will expressly inform the Brand of its right to object in the amendment notice.\"]},{\"id\":\"data-protection\",\"title\":\"15. Data Protection\",\"content\":[\"The data processing provisions agreed upon during registration apply.\"]},{\"id\":\"ai-systems\",\"title\":\"16. Use of AI Systems\",\"content\":[\"(1) We are entitled to use its own or third-party AI systems, including generative AI systems, in the performance of its services. An “AI System” refers to a machine-based system that operates autonomously or semi-autonomously, processes inputs, and produces outputs such as content, recommendations, or decisions.\",\"(2) This includes, but is not limited to, the use of Large Language Models (LLMs) such as the GPT series, as well as image generation models such as DALL·E, Midjourney, or Stable Diffusion.\",\"(3) Thrypes’s liability for the use of such systems towards the Brand is governed by § 11 (Limitation of Liability and Responsibility).\",\"(4) The rights and obligations set forth in these GTC apply equally to content generated through AI systems. Thrypes will inform the Brand if the created Content has been generated, in whole or in part, using AI systems.\"]},{\"id\":\"final-provisions\",\"title\":\"17. Final Provisions\",\"content\":[\"(1) The law of the Federal Republic of Germany applies, excluding the United Nations Convention on Contracts for the International Sale of Goods (CISG).\",\"(2) The exclusive place of jurisdiction for all disputes arising from or in connection with this contract is, to the extent permitted by law, Berlin, Germany.\",\"(3) Any amendments or supplements to this contract must be made in text form. This requirement also applies to any waiver of the text form requirement itself.\",\"(4) Should individual provisions of these GTC be or become invalid or unenforceable, the validity of the remaining provisions shall remain unaffected. In place of the invalid provision, a valid provision shall apply that most closely reflects the economic purpose of the original one.\"]}]},\"creator-terms\":{\"page\":{\"title\":\"Creator Terms and Conditions\"},\"seo\":{\"title\":\"Creator Terms and Conditions\",\"description\":\"General Terms and Conditions (GTC) for the use of the Huerray platform by content creators.\",\"keywords\":\"creator terms, GTC, platform terms, Huerray, legal agreement, content creator\"},\"effectiveDateTitle\":\"Effective as of\",\"preInfo\":\"for the Use of the Platform by Creators \u003cbr /\u003e\u003cbr /\u003e\u003cstrong\u003eThrypes GmbH\u003c/strong\u003e\u003cbr /\u003e 4th Floor, Gontardstr. 11,\u003cbr /\u003e 10178 Berlin, Germany\u003cbr /\u003e (hereinafter referred to as \\\"Thrypes\\\" or \\\"we\\\", \\\"us\\\", \\\"our\\\")\",\"effectiveDate\":\"October 23, 2025\",\"tableOfContents\":\"Table of Contents\",\"sections\":[{\"id\":\"preamble\",\"title\":\"Preamble\",\"content\":[\"Thrypes operates the online platform \u003cstrong\u003eHuerray\u003c/strong\u003e (hereinafter \\\"Platform\\\"). Access to the Platform is provided via the website \u003ca href='www.huerray.de'\u003ewww.huerray.de\u003c/a\u003e.\",\"Thrypes enables registered content creators (\\\"Creators\\\") to produce authentic video and photo content (\\\"Content\\\") for brands and companies (\\\"Brands\\\"). The Content may be used for online marketing on social media platforms or other digital channels.\",\"Brands can create specific projects or briefs on the Platform, defining topics, styles, and formats for the desired Content. These projects are published via the platform and made visible to Creators. Creators can apply for individual projects, and once a Brand selects a Creator, Thrypes manages the project coordination and quality control. We may collaborate both with human Creators and with internal or external AI systems (e.g., to support content creation or image editing).\",\"These General Terms and Conditions (\\\"Huerray Creator GTC\\\") govern the legal relationship between Thrypes and the Creators regarding the use of the Platform, the execution of projects, and the creation and remuneration of Content. By registering on Thrypes and confirming these GTC, the Creator acknowledges and accepts them as binding.\"],\"subsections\":[]},{\"id\":\"scope-application\",\"title\":\"1. Scope of Application\",\"content\":[\"(1) These General Terms and Conditions (\\\"GTC\\\") govern the legal relationship between Thrypes and the registered content creators (\\\"Creators\\\") in connection with the use of the Platform, the execution of projects, and the creation and submission of content (\\\"Content\\\").\",\"(2) Individually negotiated agreements between Thrypes and the Creator take precedence over these GTC. Unless proven otherwise, such agreements must be documented or confirmed in writing.\",\"(3) The use of the Huerray Platform is reserved exclusively for entrepreneurs or self‑employed individuals as defined in Section 14 of the German Civil Code (BGB). By registering, the Creator confirms that they are acting in a professional or commercial capacity or have duly registered as self‑employed.\",\"(4) Thrypes grants Creators a non‑transferable, revocable license to use the Platform solely within the framework of these GTC and the functionalities provided therein.\",\"(5) Any differing, conflicting, or supplementary terms and conditions of the Creator shall not apply unless we have expressly agreed to their validity in writing.\"]},{\"id\":\"scope-services\",\"title\":\"2. Scope of Services\",\"content\":[\"(1) The Creator agrees to produce the content commissioned by the Brand via the platform (e.g. photo, video, or audio content) in accordance with the briefing provided through the platform and to transfer the corresponding rights to Thrypes as outlined in Section 6 of these Creator Terms.\",\"(2) The Creator shall generally produce the Content personally but may, with prior approval from us, engage carefully selected third parties (\\\"Co‑Creators\\\") under their own responsibility. The Creator is solely responsible for the selection, instruction, and rights transfer of such Co‑Creators.\",\"(3) The Creator will appear personally in the Content unless otherwise agreed, or may feature other individuals selected by the Brand or Thrypes, provided those individuals have explicitly consented to the rights transfer.\",\"(4) The final Content must be delivered by uploading it through the designated feature on the platform. Unless otherwise agreed, the upload must take place no later than seven (7) calendar days after the conclusion of the contract and the receipt of all necessary production materials (see Section 7).\",\"(5) The Creator agrees to make up to two reasonable revisions of the Content within one (1) feedback round, provided that Thrypes or the Brand requests changes within seven (7) days after upload and such changes fall within the scope of the original briefing. These revisions are covered by the agreed fee and must be implemented within seven (7) calendar days after receiving the feedback.\",\"(6) The Creator is not obliged to make revisions that would require disproportionate effort or go beyond the agreed briefing. Statutory warranty rights (Section 10) remain unaffected.\",\"(7) The contractual relationship between the Creator and us is independent. The Creator performs the agreed services as a self‑employed professional, in their own name and at their own expense. No rights or claims arise for the Creator from the contractual relationship between Thrypes and the Brand.\",\"(8) We may use our own or external AI systems to support content creation. In such cases, the Creator will be informed accordingly; the Creator’s contractual obligations remain unaffected.\"]},{\"id\":\"conclusion-contract\",\"title\":\"3. Conclusion of Contract\",\"content\":[\"(1) By applying for a project published on the platform, the Creator submits a binding offer to enter into a contract for the creation of the content described in the briefing.\",\"(2) The contract is concluded once Thrypes selects the Creator for the respective project, or when the Brand accepts the Creator’s application and Thrypes confirms the project in writing or on the platform. A response period of fourteen (14) calendar days shall apply.\",\"(3) We are under no obligation to accept any submitted application or to enter into a contractual relationship. Applications may be declined or withdrawn at any time without stating reasons.\",\"(4) After the contract has been concluded, the Creator receives a project confirmation via the Platform or by email containing all relevant details (briefing, deadlines, payment, production materials, and delivery method).\",\"(5) The contractual basis consists of these Huerray Creator Terms, the respective briefing, and any supplementary agreements communicated to the Creator in writing.\",\"(6) The Creator acts independently and on their own responsibility throughout the execution of the contract. No employment relationship exists between Thrypes and the Creator. The Creator is solely responsible for fulfilling their tax and social security obligations arising from their activity.\"]},{\"id\":\"compensation-payment\",\"title\":\"4. Compensation and Payment\",\"content\":[\"(1) For creating the agreed Content, the Creator receives compensation from Thrypes as specified in the contract. The applicable payment amount is displayed to the Creator on the Platform before submitting an application. Within an ongoing project, the Creator may propose additional or extended services. If the Brand accepts such an offer, the extension is confirmed as an additional project through the Platform and the compensation adjusted accordingly.\",\"(2) Payments are processed via a credit note system. After the Content has been successfully approved, Thrypes issues a credit note on behalf of the Creator, made available in electronic form (PDF) via the Creator's Thrypes account.\",\"(3) The Creator's entitlement to payment arises upon Thrypes's approval of the Content. Approval is generally granted within ten (10) days after the upload of the final Content, provided it meets the requirements of the briefing and any agreed additional services.\",\"(4) The approval confirmation is sent electronically via the Platform or by email. The payment becomes due upon receipt of this confirmation. Thrypes then transfers the amount to the Creator's registered bank or payment account.\",\"(5) The Creator is responsible for the proper taxation of their income. By accepting these Terms, the Creator confirms that they operate a commercial or self-employed business and possess a valid tax number.\"]},{\"id\":\"grant-of-rights\",\"title\":\"5. Grant of Rights\",\"content\":[\"(1) Upon full payment of the agreed compensation, the Creator grants Thrypes GmbH the exclusive, unlimited right to use the created Content without temporal, territorial, or material restrictions. This right covers all known and future forms of use. In particular, it includes the rights to store, reproduce, exhibit, publish, distribute, publicly perform, and make the Content available online—including use on social networks, in digital campaigns, print and online media, PR materials, audiovisual advertising formats, and at the point of sale.\",\"(2) Thrypes is entitled to use, edit, or combine the Content for editorial, advertising, and internal purposes, provided the Creator’s legitimate interests—especially personality rights—are respected. To the extent permitted by law, the Creator waives the right to be credited as author and any approval right with respect to editing, combining, or publishing.\",\"(3) Thrypes is entitled to grant sublicenses to Brands or other third parties and to exploit the granted rights in its own name or in the name of third parties.\",\"(4) The Creator also grants Thrypes the right to pursue infringements of the granted rights by third parties, in our own name, in and out of court. The Creator undertakes to support us by providing the necessary information and evidence.\",\"(5) Thrypes is entitled to use the Content, in whole or in part, in connection with AI systems, in particular as training, validation, or test data, as input for generative models, or to exploit the resulting outputs for its own or commercial purposes.\",\"(6) The Creator transfers usage, authorship, and exploitation rights exclusively to Thrypes. Any use of the Content by the Creator or third parties outside the platform is permitted only with our express written consent.\",\"(7) We are not obliged to publish or use the created Content.\"]},{\"id\":\"use-of-ai\",\"title\":\"6. Use of AI Systems\",\"content\":[\"(1) Thrypes develops its own artificial intelligence (AI) systems, deploys third-party AI models, or combines both approaches (collectively, “Thrypes AI”). For the purposes of this provision, an AI system is a machine-based system that operates with varying degrees of autonomy and generates outputs—such as content, recommendations, or predictions—based on inputs it receives.\",\"(2) The rights granted under Section 5 expressly include the use of the Creator’s Content for AI training, further development, and application of Thrypes AI. This includes, in particular, the analysis, processing, storage, and algorithmic use of the Content to improve models, generate new content, and develop automated features.\",\"(3) The Creator expressly consents to Thrypes using all data and content transmitted or generated under the contract—including any personal data—for the purposes set out above. This consent may be withdrawn at any time with effect for the future, without affecting the lawfulness of processing based on consent before its withdrawal.\",\"(4) Thrypes undertakes to process all data and Content used for AI training in compliance with the GDPR and other applicable data protection laws and to implement appropriate technical and organizational measures to protect the data.\"]},{\"id\":\"representations-warranties\",\"title\":\"7. Representations and Warranties\",\"content\":[\"(1) The Creator represents and warrants that they hold all rights necessary in the created Content and are authorized to grant us the usage and exploitation rights set out in these GTC in full.\",\"(2) Where third parties (e.g., Co-Creators, models, camera operators, audio or editing contributors) participate in or are identifiable within the Content, the Creator represents that all required consents and rights transfers from such persons have been obtained. This includes, in particular, personality rights, image rights, neighboring rights, and data protection consents.\",\"(3) The Creator warrants that the Content created by them is free of third-party rights and that its use by Thrypes or the Brand does not infringe third-party rights, in particular copyrights, trademarks, personality rights, or competition rights.\",\"(4) The Creator undertakes to inform us without undue delay as soon as they become aware of any indications or notices of potential third-party rights infringements in connection with the created Content.\"]},{\"id\":\"production-materials\",\"title\":\"9. Production Materials\",\"content\":[\"(1) Any items, products, samples, or materials provided by the Brand for the purpose of creating the Content (“Production Materials”) become the property of Thrypes upon delivery to the Creator or directly to Thrypes, even if such delivery is made directly by the Brand.\",\"(2) The Creator is only obliged to return the Production Materials if Thrypes has expressly not granted permanent possession of them. If the agreed Content is not created or uploaded on time, or if the Creator refuses to make required revisions pursuant to Section 2(5), the Creator must return all Production Materials to Thrypes, even if they were originally intended for permanent retention.\",\"(3) The Creator must handle all Production Materials with care and use them solely for the purpose of fulfilling the respective project. Any other use, transfer, or promotion of such materials without our prior written consent is prohibited.\",\"(4) If the Creator fails to return Production Materials within the specified period after being requested to do so, they shall pay Thrypes a contractual penalty equal to the retail value of the respective item, but not less than EUR 150. This contractual penalty will be offset against any further claims for damages.\"]},{\"id\":\"termination-rights\",\"title\":\"10. Termination Rights\",\"content\":[\"(1) Thrypes and the Creator may terminate the contractual relationship at any time without notice for good cause. Good cause exists in particular if: a) the Creator breaches material contractual obligations or legal provisions, b) the Creator fails to perform or properly fulfill the agreed service despite being requested to do so, c) the Creator provides false information regarding their identity, activity, or legal status, d) the Creator creates or distributes content that violates applicable law, public decency, or platform policies, or e) insolvency proceedings are initiated against the Creator’s assets or such proceedings are dismissed for lack of assets.\",\"(2) Ordinary termination of individual ongoing projects is excluded. The Creator must properly fulfill all accepted projects unless Thrypes expressly extends the termination to the respective project.\",\"(3) Terminations must be made in writing (e.g., by email).\",\"(4) In the event of a justified termination for cause by Thrypes, the Creator forfeits all claims to payment for services not yet rendered.\"]},{\"id\":\"non-solicitation\",\"title\":\"11. Non‑Solicitation Clause\",\"content\":[\"(1) The Creator is subject to a client protection obligation toward Thrypes. During the term of the contractual relationship and for a period of three (3) months after its termination, the Creator may not accept or carry out direct or indirect projects from Brands that became known to them in connection with their activities via Thrypes.\",\"(2) This client protection obligation applies within Germany, Austria, and Switzerland, and covers in particular all services related to user-generated content, brand collaborations, or advertising production.\",\"(3) In the event of a breach of this obligation, the Creator shall pay Thrypes a contractual penalty equal to three times the agreed compensation for the respective project — even if the Content was not produced (“hypothetical compensation”). We also reserve the right to suspend the Creator’s account and assert further claims for injunctive relief or damages.\",\"(4) If there is uncertainty as to whether a Brand became known to the Creator through their activities with us, the Creator bears the burden of proof that the Brand was known to them independently of Thrypes.\",\"(5) If the Creator is excluded from using the Platform without good cause, they may declare in writing within one month of the suspension that they no longer consider themselves bound by the client protection clause; in this case, the clause becomes void.\"]},{\"id\":\"confidentiality\",\"title\":\"12. Confidentiality\",\"content\":[\"(1) Both parties agree to treat all confidential information disclosed to them in connection with the performance of this Agreement as strictly confidential and to use such information only for the purposes agreed under this contract.\",\"(2) “Confidential information” means all information, documents, data, and materials that are marked as confidential or are, by their nature, to be considered confidential. The Creator undertakes, in particular, to grant access to confidential information of the Brand only to persons directly involved in fulfilling the contractual services. Both parties also agree not to file any intellectual property applications based on the other party’s confidential information.\",\"(3) If either party is legally required or ordered by a public authority to disclose confidential information, they must notify the other party immediately—and, where legally permissible, before disclosure—of such obligation.\",\"(4) The confidentiality obligations shall continue to apply after termination of this Agreement. Upon termination, both parties must, upon request, promptly return or—where no legal retention obligations exist—destroy all confidential information belonging to the other party, to the extent it has not been lawfully consumed in the course of fulfilling this Agreement.\"]},{\"id\":\"indemnification\",\"title\":\"13. Indemnification\",\"content\":[\"(1) The Creator shall indemnify and hold Thrypes harmless from all reasonable costs and expenses incurred in the defense against justified third-party claims, provided such claims arise because: \u003cul class='ml-8'\u003e \u003cli class='mb-4'\u003ea) third parties assert an infringement of their intellectual property rights against Thrypes in connection with Content created by the Creator and such infringement results from the Creator’s culpable conduct; or\u003c/li\u003e \u003cli class='mb-4'\u003eb) third parties assert claims arising from the Creator’s culpable breach of the representations and warranties set out in these Terms (in particular, but not limited to, Section 7).\u003c/li\u003e\u003c/ul\u003e\",\"(2) The indemnification obligation shall not apply to the extent that the respective third-party claim is attributable to our own fault.\",\"(3) The Creator’s indemnification obligation applies only if a) the respective third-party claim has been finally adjudicated, and b) Thrypes has informed the Creator in writing of the claim within a reasonable period after such final adjudication.\"]},{\"id\":\"data-protection\",\"title\":\"14. Data Protection\",\"content\":[\"Where Thrypes processes personal data in the course of providing services for which it is not the controller within the meaning of the GDPR, or where access to such data cannot be excluded, the parties shall, in advance, enter into a data processing agreement compliant with Article 28 GDPR.\",\"If personal data of third parties is transmitted to us by the Creator, such processing shall take place solely on behalf of the Creator and in accordance with the applicable legal requirements. The Creator remains responsible for the lawfulness of such data processing.\",\"No transfer of functions to Thrypes shall take place. We reserve the right to restrict or suspend certain Platform functionalities if no valid data processing agreement is in place.\"]},{\"id\":\"amendments\",\"title\":\"15. Amendments to the Terms\",\"content\":\"We reserve the right to amend these Terms in the future where justified reasons exist (e.g., legal changes, new services, or technical adjustments). The Creator will be informed of any amendments by email at least four weeks before they take effect. If the Creator does not object within this period, the amendments shall be deemed accepted.\"},{\"id\":\"final-provisions\",\"title\":\"16. Final Provisions\",\"content\":[\"(1) This Agreement is governed by the laws of the Federal Republic of Germany, excluding its conflict-of-law rules and the United Nations Convention on Contracts for the International Sale of Goods (CISG).\",\"(2) The Creator may only set off claims that are undisputed or have been finally adjudicated. The same applies to the assertion of rights of retention.\",\"(3) The assignment of claims or rights under this Agreement by the Creator is only permitted with our prior written consent, subject to § 354a of the German Commercial Code (HGB).\",\"(4) Should any provision of this Agreement be or become invalid, the validity of the remaining provisions shall remain unaffected. In place of the invalid provision, a valid one shall apply that most closely reflects the intended economic purpose. The same applies in the event of contractual gaps.\",\"(5) The place of performance and jurisdiction is the registered seat of Thrypes, provided the Creator is a merchant, a legal entity under public law, or a special fund under public law, or does not have a general place of jurisdiction in Germany. We reserve the right to bring action against the Creator at their general place of jurisdiction.\",\"(6) The contractual language is German. Translations are provided for convenience only; in case of discrepancies, the German version of these General Terms and Conditions shall prevail.\"]}]},\"site-notice\":{\"page\":{\"title\":\"Site Notice\"},\"seo\":{\"title\":\"Site Notice\",\"description\":\"Legal site notice for Huerray platform.\",\"keywords\":\"site notice, legal, imprint, Huerray\"},\"effectiveDateTitle\":\"Effective as of\",\"effectiveDate\":\"October 23, 2025\",\"tableOfContents\":\"Information\",\"sections\":[{\"id\":\"contact\",\"title\":\"Contact Information\",\"content\":[\"THRYPES GmbH \u003cbr /\u003e4th Floor, \u003cbr /\u003eGontardstraße 11, \u003cbr /\u003e10178 Berlin, Germany \u003cbr /\u003e\",\"\u003cstrong\u003eEmail:\u003c/strong\u003e \u003ca href='mailto:info@thyrpes.com'\u003einfo@thyrpes.com\u003c/a\u003e\",\"\u003cstrong\u003eRegister court:\u003c/strong\u003e Charlottenburg District Court - Commercial Register \u003cbr /\u003e\u003cstrong\u003eRegister number:\u003c/strong\u003e HRB 256430 \u003cbr /\u003e\u003cstrong\u003eUST-ID Number:\u003c/strong\u003e DE 363934690\"],\"subsections\":[]}]},\"brands-faq\":{\"title\":\"Brands' FAQ\",\"subtitle\":\"Here are some of our most frequently asked questions.\",\"sections\":[{\"section\":\"General\",\"faqs\":[{\"question\":\"What is Huerray?\",\"answer\":\"Huerray is a UGC platform that connects brands with diverse creators and AI-powered storytelling tools. The platform focuses on authentic content, cultural relevance, and meaningful representation, especially for People of Color and underrepresented audiences in the DACH region.\"},{\"question\":\"What is UGC and why does it work so well?\",\"answer\":\"User-generated content (UGC) is content created by real people, such as customers or creators. It feels natural and builds trust, often leading to higher engagement and stronger campaign performance than traditional ads.\"},{\"question\":\"Do creators post the content on their own social media channels?\",\"answer\":\"No. Creators produce content for your brand but do not automatically post it on their own accounts. Creator reach can be added as an optional add-on.\"},{\"question\":\"What makes Huerray different from other UGC platforms?\",\"answer\":\"Huerray combines diversity, cultural intelligence, and AI innovation to deliver emotionally impactful content. Unlike traditional platforms that only match creators and brands, Huerray enhances storytelling through both human and AI capabilities.\"}]},{\"section\":\"Processes\",\"faqs\":[{\"question\":\"How does a campaign with Huerray work?\",\"answer\":\"After creating an account, you can start your campaign briefing by specifying product goals, messaging, audience, tone, formats, and storytelling style. You receive curated creator recommendations, and creators may also apply. Once approved, the creator produces the content, you receive a preview, and can request one revision before receiving final assets with full usage rights.\"},{\"question\":\"Does Huerray use AI instead of real creators?\",\"answer\":\"Brands can choose between human-created content or AI Creator content.\"},{\"question\":\"Is there a minimum budget or commitment?\",\"answer\":\"No. You may collaborate per campaign or on a long-term basis without fixed commitments.\"},{\"question\":\"How long does production take?\",\"answer\":\"Production typically takes 7–14 days, including one feedback round. Faster delivery is available upon request.\"},{\"question\":\"What if I'm not satisfied with the delivered content?\",\"answer\":\"Each campaign includes one revision. If the content does not align with your briefing, you can request a revision via the 'Request revision' button.\"},{\"question\":\"How much does it cost to work with Huerray?\",\"answer\":\"Pricing depends on the campaign scope. UGC packages start from €149, and AI-creator campaigns from €89.\"},{\"question\":\"What usage rights do I receive?\",\"answer\":\"After final payment, you receive exclusive, unlimited usage rights across time, region, and media, subject to Huerray's AGB.\"},{\"question\":\"Which file formats will I receive?\",\"answer\":\"Supported formats include .mov, .avi, .mp4, and .mpeg4. Specific requirements can be added to the campaign briefing.\"},{\"question\":\"How do I download the videos?\",\"answer\":\"Approve the content in your campaign gig, then the files become available for immediate download.\"},{\"question\":\"What if I want to order an additional UGC video from a Creator I've already worked with?\",\"answer\":\"You can either create a new briefing and invite the creator, or request an upgrade within the existing campaign by emailing Huerray with campaign and creator details.\"},{\"question\":\"What if I want to assign more Creators to a campaign than originally booked?\",\"answer\":\"You may invite additional creators from the application list. If this exceeds your initial booking, email Huerray to update the order and invoice.\"},{\"question\":\"Can I change the campaign specifications after submitting the briefing?\",\"answer\":\"Upgrades and additions are allowed after order creation, but reductions are not since payment is tied to creator compensation. To increase scope, email Huerray with details.\"},{\"question\":\"How can I cancel my order?\",\"answer\":\"Send Huerray an email with the order link and reason for cancellation. The team will review and process your request.\"}]},{\"section\":\"Brief \u0026 Creator Applications\",\"faqs\":[{\"question\":\"What do I need to do to start receiving applications from Creators?\",\"answer\":\"Complete your briefing and submit it for review. Once approved, the briefing is posted on the platform and creators can apply. All applications appear on your campaign page for review.\"},{\"question\":\"My briefing is under review — what does that mean?\",\"answer\":\"Huerray checks that your briefing includes sufficient details for creators to produce aligned content. You may receive suggestions if adjustments are needed.\"},{\"question\":\"What happens after my briefing is approved?\",\"answer\":\"Your briefing is shared with relevant creators. Applications typically begin arriving within 3 days.\"}]},{\"section\":\"Deadlines \u0026 Delivery Timelines\",\"faqs\":[{\"question\":\"How long does it take to receive my final UGC?\",\"answer\":\"Once the creator receives the product and clarifications, standard delivery is 7 days. One free revision is included.\"},{\"question\":\"How long do I have to request a revision?\",\"answer\":\"Revisions must be requested within 10 days of content submission. If more time is needed, coordinate with Huerray via email.\"}]},{\"section\":\"Payment\",\"faqs\":[{\"question\":\"Will I receive invoices for my orders?\",\"answer\":\"Yes. Every payment processed via Huerray generates an invoice. All invoices are accessible anytime in your dashboard under 'Invoices'.\"}]},{\"section\":\"Account\",\"faqs\":[{\"question\":\"I forgot my password — what should I do?\",\"answer\":\"Use the 'Reset password' option on the login page. If issues persist, email Huerray for assistance.\"},{\"question\":\"Can I grant access to other team members?\",\"answer\":\"Yes. Email Huerray with the names and email addresses of colleagues you want to add. They will activate and confirm access.\"}]},{\"section\":\"Support\",\"faqs\":[{\"question\":\"Still have questions?\",\"answer\":\"Email support@huerray.com for help.\"}]}],\"seo\":{\"title\":\"Brands' FAQ\",\"description\":\"Frequently asked questions for brands about pricing, campaigns, and UGC on Huerray.\"}},\"creators-faq\":{\"title\":\"Creators' FAQ\",\"subtitle\":\"Here are some of our most frequently asked questions.\",\"sections\":[{\"section\":\"About Huerray\",\"faqs\":[{\"question\":\"What is Huerray?\",\"answer\":\"Huerray is a UGC platform connecting brands with diverse creators, focusing on authentic storytelling, cultural relevance, and meaningful representation, especially for People of Color and underrepresented voices in the DACH region.\"},{\"question\":\"Do I need to post the content on my own social media channels?\",\"answer\":\"No. You create the content for the brand; publishing on your own channels is not required unless it is explicitly part of the campaign offer.\"}]},{\"section\":\"How It Works\",\"faqs\":[{\"question\":\"How do I apply for campaigns?\",\"answer\":\"Complete your creator profile and browse available campaigns that match your style. Apply directly if you're interested. The brand reviews applications and selects creators. Once you accept the assignment, production begins.\"},{\"question\":\"What happens after I’m selected?\",\"answer\":\"You’ll receive full briefing details. If needed, the client sends production materials. You then create and upload the content through the Huerray platform.\"}]},{\"section\":\"Content Upload \u0026 Workflow\",\"faqs\":[{\"question\":\"Where do I upload my final content?\",\"answer\":\"Upload your content in the designated delivery slot within the 'Delivery' section of your campaign. For extra footage, use the 'Additional delivery' button.\"},{\"question\":\"What if a brand requests an additional video during an active campaign?\",\"answer\":\"Contact Huerray via email. They will set up a campaign upgrade so the additional video can be processed and compensated.\"},{\"question\":\"What if I’m unavailable or on holiday?\",\"answer\":\"Activate Vacation Mode and set your unavailable period, or email Huerray to pause your account. You may also mention availability in applications. Key: communicate early.\"},{\"question\":\"Can I do this part-time?\",\"answer\":\"Yes. Many creators work with Huerray alongside jobs or studies. Your workload depends on your availability and workflow efficiency.\"},{\"question\":\"Do I need professional equipment?\",\"answer\":\"Professional gear is not required, but recommended tools include a tripod, microphone, and ring light.\"},{\"question\":\"What camera settings should I use?\",\"answer\":\"Use your smartphone. Record in 4K, check exposure, and clean the lens before filming.\"}]},{\"section\":\"Deadlines \u0026 Delivery\",\"faqs\":[{\"question\":\"How much time do I have to deliver the content?\",\"answer\":\"Standard delivery is 7 calendar days from receiving all assets and clarifications. Contact Huerray before the deadline if more time is needed.\"},{\"question\":\"Can brands request revisions?\",\"answer\":\"Yes. One revision round is included per campaign, provided feedback is given within 10 days and remains within the briefing scope.\"}]},{\"section\":\"Payment\",\"faqs\":[{\"question\":\"How much do I earn per campaign?\",\"answer\":\"Your fee is shown before applying. Additional deliverables or services can be offered as paid upgrades, subject to brand approval.\"},{\"question\":\"When do I get paid?\",\"answer\":\"Payment is triggered once content is approved. Huerray processes the payment and issues an invoice for you. Once your balance reaches €50, payment is transferred within 14 days.\"}]},{\"section\":\"Content Rights\",\"faqs\":[{\"question\":\"Who owns the content I create?\",\"answer\":\"Upon approval and payment, usage rights transfer to Huerray for exclusive commercial use, including digital, print, OOH advertising, and AI training. You may not reuse or publish the content unless explicitly permitted.\"}]},{\"section\":\"Production Materials\",\"faqs\":[{\"question\":\"What if I receive products from the brand?\",\"answer\":\"Products provided for UGC creation remain the property of Huerray unless explicitly stated otherwise. They must be returned upon request.\"}]},{\"section\":\"Legal \u0026 Conduct\",\"faqs\":[{\"question\":\"Can I work with the brand outside of Huerray?\",\"answer\":\"No. Direct collaboration outside Huerray is prohibited for 3 months after campaign completion. Violations may lead to account suspension or penalties.\"},{\"question\":\"What are my responsibilities as a Creator?\",\"answer\":\"You must ensure all content is original, non-infringing, consented by third parties visible, free of harmful or illegal material, and fully aligned with campaign guidelines.\"}]},{\"section\":\"Account\",\"faqs\":[{\"question\":\"I can't access my account – what should I do?\",\"answer\":\"Click 'Reset password' on the login page. If problems persist, email Huerray support for assistance.\"}]},{\"section\":\"Support\",\"faqs\":[{\"question\":\"Still have questions?\",\"answer\":\"Email support@huerray.com for immediate assistance.\"}]}],\"seo\":{\"title\":\"Creators' FAQ\",\"description\":\"Find answers to common questions about becoming a creator, payments, and campaigns on Huerray.\"}},\"managed-services\":{\"hero\":{\"title\":\"Your UGC. Fully Managed.\",\"subtitle\":\"From strategy and briefing to creator sourcing and final delivery — our Managed Service team handles every step so you can focus on growing your brand.\",\"buttonText\":\"Book a Free Call\"},\"features\":{\"title\":\"What we take off your plate\",\"items\":[{\"title\":\"We Handle Everything\",\"description\":\"From developing the concept and writing the brief to sourcing creators and editing the final cuts — we take it all off your hands. Less back-and-forth, more content that actually performs.\"},{\"title\":\"Matched With Precision\",\"description\":\"We know our creator network inside out — who has delivered in your niche, who is reliable, and who will treat your product with the care it deserves. Need someone outside our network? We will recruit them.\"},{\"title\":\"Informed by Real Campaigns\",\"description\":\"Hundreds of brand collaborations have given us a sharp instinct for what works in UGC — and what does not. Every campaign we manage is shaped by that experience, so you benefit from day one.\"}]},\"cta\":{\"text\":\"Ready to hand it over? Let's build your strategy.\",\"buttonText\":\"Book a Free Call\"},\"faqs\":{\"title\":\"Common questions\",\"items\":[{\"question\":\"Can I have input on the creator selection?\",\"answer\":\"Of course. We do the heavy lifting — screening our network and shortlisting the strongest candidates for your brief. But the final choice is always yours.\"},{\"question\":\"What if I want to manage campaigns myself down the line?\",\"answer\":\"That's completely fine. Huerray's platform is built for full transparency, so you can follow every step in real time. Whenever you're ready to take the wheel, the tools are there waiting for you.\"},{\"question\":\"What does Managed Service cost?\",\"answer\":\"It depends on the scope — how many videos you need, how many briefings we are writing, and how many creators are involved. Pricing typically starts at €750. Book a call and we will put together a tailored quote.\"},{\"question\":\"How is this different from working with a UGC agency?\",\"answer\":\"We do not do long-term retainers or rigid contracts. Every engagement is project-based, and our platform means we operate with more speed and transparency than a traditional agency. You get agency-level execution with platform-level flexibility.\"}]}},\"auth\":{\"login\":{\"title\":\"Login to Huerray\",\"description\":\"Welcome back. Sign in to your Huerray account to continue\",\"emailLabel\":\"Email\",\"usernameOrEmailLabel\":\"Email or Username\",\"emailPlaceholder\":\"you@example.com\",\"usernameOrEmailPlaceholder\":\"you@example.com or username\",\"passwordLabel\":\"Password\",\"forgotPassword\":\"Forgot password?\",\"keepMeLoggedIn\":\"Keep me logged in\",\"submitButton\":\"Sign in\",\"submittingButton\":\"Signing in...\",\"signUpPrompt\":\"Don't have an account?\",\"signUpLink\":\"Sign up\",\"termsText\":\"By continuing, you agree to our\",\"termsLink\":\"Terms of Service\",\"and\":\"and\",\"privacyLink\":\"Privacy Policy\",\"resetSuccess\":\"Password reset successful! You can now sign in with your new password.\",\"errors\":{\"default\":\"Login failed. Please check your credentials.\",\"suffixInvalid\":\"Invalid username or password.\"},\"show\":\"Show\",\"hide\":\"Hide\"},\"validation\":{\"emailInvalid\":\"Please enter a valid email address\",\"passwordRequired\":\"Password is required\",\"firstNameRequired\":\"First name is required\",\"lastNameRequired\":\"Last name is required\",\"passwordMin\":\"Password must be at least 8 characters\",\"confirmPasswordRequired\":\"Confirm Password is required\",\"passwordsDoNotMatc
